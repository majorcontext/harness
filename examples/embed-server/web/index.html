<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness embed</title>
<link rel="stylesheet" href="/style.css">
<div class="term">
  <header class="bar">
    <span>harness</span>
    <span id="model"></span>
  </header>

  <main class="log" id="log" aria-live="polite"></main>

  <form class="input" id="form">
    <label for="prompt">&gt;</label>
    <textarea id="prompt" rows="1" disabled autocomplete="off" spellcheck="false" aria-label="Prompt"></textarea>
  </form>

  <footer class="status">
    <span id="status" role="status">loading</span>
    <span class="keys">
      <span id="who"></span>
      <button class="link" id="new" type="button">new session</button>
      <a href="/settings/codex" target="_blank" rel="noopener">chatgpt login</a>
      <a href="/login" id="login">sign in</a>
      <form method="post" action="/logout"><button class="link" id="logout">sign out</button></form>
    </span>
  </footer>
</div>
<script type="module">
import { createHarness, wasm } from "/embed/index.mjs";

const $ = (id) => document.getElementById(id);
const log = $("log");
const input = $("prompt");

const status = (text, cls = "") => {
  $("status").textContent = text;
  $("status").className = cls;
};
const el = (tag, cls, text = "") => {
  const e = document.createElement(tag);
  e.className = cls;
  e.textContent = text;
  return e;
};
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
const follow = (fn) => {
  const stick = atBottom();
  fn();
  if (stick) log.scrollTop = log.scrollHeight;
};

const refreshWho = async () => {
  const who = await (await fetch("/whoami")).json();
  $("who").textContent = who.user ?? "not signed in";
  $("login").hidden = !!who.user;
  $("logout").hidden = !who.user;
};
await refreshWho();
window.addEventListener("focus", refreshWho);

// The module holds no credential. The server adds it to the requests that go
// to /model-proxy/, and answers 401 until the user signs in at /settings/codex.
const model = "codex/gpt-6.1-sol";
$("model").textContent = model;
// The sessions live in the origin private file system, so a reload keeps
// them. One tab holds the store at a time; another tab runs on a memory store.
const options = {
  transport: wasm({ module: "/harness.wasm", wasmExec: "/wasm_exec.js", worker: true }),
  config: {
    model,
    providers: {
      codex: {
        type: "openai", auth: "injected", responses_path: "/responses", models_from: "chatgpt",
        omit_response_params: ["max_output_tokens", "temperature", "top_p", "metadata"],
        sanitize_tool_schemas: true,
      },
    },
  },
  proxy: { providers: { codex: { baseURL: "/model-proxy/relay/codex", loginURL: "/settings/codex" } } },
  tools: [],
  builtinTools: [],
};
let h;
let persisted = true;
try {
  h = await createHarness({ ...options, store: { persist: true } });
} catch (err) {
  if (err?.code !== "store_in_use") throw err;
  persisted = false;
  h = await createHarness(options);
}

// A minimal ACP client: JSON-RPC over h.stream.
const writer = h.stream.writable.getWriter();
const reader = h.stream.readable.getReader();
const pending = new Map();
let nextId = 1;
let onUpdate = () => {};
let usage = "";
let contextUsed = 0;
(async () => {
  for (;;) {
    const { value: m, done } = await reader.read();
    if (done) return;
    if (m.id !== undefined && pending.has(m.id)) {
      pending.get(m.id)(m);
      pending.delete(m.id);
    } else if (m.method === "session/update") {
      const u = m.params.update;
      if (u.sessionUpdate === "usage_update" && u.size) {
        usage = `${Math.round((100 * u.used) / u.size)}% context`;
        contextUsed = u.used;
      }
      onUpdate(u);
    }
  }
})();
const call = (method, params) =>
  new Promise((resolve) => {
    const id = nextId++;
    pending.set(id, resolve);
    writer.write({ jsonrpc: "2.0", id, method, params });
  });

await call("initialize", { protocolVersion: 1, clientCapabilities: {} });

// A session needs the ChatGPT login of the user. Until the server holds one,
// session/new and session/load fail; the page tries again when the tab gets
// the focus back. The id of the session stays in localStorage, and
// session/load replays its conversation into the scrollback.
const saved = {
  get: () => { try { return localStorage.getItem("harness.session"); } catch { return null; } },
  set: (id) => { try { id ? localStorage.setItem("harness.session", id) : localStorage.removeItem("harness.session"); } catch {} },
};
let sessionId = null;
let notice = null;
let running = false;
let last = "";

// replay renders the updates of session/load: a user_message_chunk starts a
// turn, the agent chunks fill it.
const replay = () => {
  let turn = null, reply = null, thought = null, lastUser = null;
  return (u) => {
    const t = u.content?.type === "text" ? u.content.text : null;
    if (t === null) return;
    if (u.sessionUpdate === "user_message_chunk") {
      if (lastUser && u.messageId && u.messageId === lastUser.id) {
        lastUser.el.textContent += t;
        return;
      }
      turn = el("section", "turn");
      lastUser = { id: u.messageId, el: el("div", "line you", t) };
      reply = el("div", "line reply");
      thought = null;
      turn.append(lastUser.el, reply);
      log.append(turn);
    } else if (turn && u.sessionUpdate === "agent_message_chunk") {
      reply.textContent += t;
    } else if (turn && u.sessionUpdate === "agent_thought_chunk") {
      thought ??= turn.insertBefore(el("div", "line thought"), reply);
      thought.textContent += t;
    }
  };
};

const fail = (err) => {
  notice = el("section", "turn");
  notice.append(el("div", "line warn", err?.message ?? "no session"));
  if (err?.data?.code === "login_required") notice.append(el("div", "line meta", "Sign in with ChatGPT, then come back to this tab."));
  follow(() => log.append(notice));
  status(err?.data?.code === "login_required" ? "no chatgpt login" : "error", "warn");
};

const open = async () => {
  if (sessionId) return;
  notice?.remove();
  notice = null;
  const id = saved.get();
  if (id) {
    status("loading session");
    const mark = log.childElementCount;
    onUpdate = replay();
    const loaded = await call("session/load", { sessionId: id, cwd: "/work", mcpServers: [] });
    onUpdate = () => {};
    if (loaded.result) {
      sessionId = id;
    } else {
      while (log.childElementCount > mark) log.lastElementChild.remove();
      if (loaded.error?.data?.code === "login_required") return fail(loaded.error);
      saved.set(null);
    }
  }
  if (!sessionId) {
    status("starting session");
    const created = await call("session/new", { cwd: "/work", mcpServers: [] });
    if (!created.result) return fail(created.error);
    sessionId = created.result.sessionId;
    saved.set(sessionId);
  }
  log.scrollTop = log.scrollHeight;
  status(persisted ? "enter: send · shift+enter: new line" : "another tab holds the store · this tab keeps no history", persisted ? "" : "warn");
  input.disabled = false;
  input.focus();
};

$("new").addEventListener("click", async () => {
  if (running) return;
  saved.set(null);
  sessionId = null;
  usage = "";
  contextUsed = 0;
  log.replaceChildren();
  input.disabled = true;
  await open();
});

await open();
window.addEventListener("focus", open);

const grow = () => {
  input.style.height = "auto";
  input.style.height = `${input.scrollHeight}px`;
};
input.addEventListener("input", grow);

const send = async () => {
  const text = input.value.trim();
  if (!text || running || !sessionId) return;
  running = true;
  last = text;
  input.value = "";
  grow();
  input.disabled = true;

  const turn = el("section", "turn");
  const reply = el("div", "line reply");
  const live = el("div", "line meta");
  let thought = null;
  let streamed = 0;
  follow(() => {
    turn.append(el("div", "line you", text), reply, live);
    log.append(turn);
  });

  // ACP reports the context size, not the tokens of a turn: up is the context
  // that the newest model call sent, down is estimated from the streamed text.
  const startUsed = contextUsed;
  const t0 = performance.now();
  const kfmt = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n));
  const counts = () => {
    const secs = `${((performance.now() - t0) / 1000).toFixed(1)}s`;
    const up = contextUsed > startUsed ? `↑ ${kfmt(contextUsed)}` : "↑ –";
    return [secs, up, `↓ ~${kfmt(Math.round(streamed / 4))}`];
  };
  const tick = () => {
    const phase = reply.textContent ? "responding" : "thinking";
    live.textContent = [phase, ...counts()].join(" · ");
  };
  tick();
  const timer = setInterval(tick, 100);

  onUpdate = (u) =>
    follow(() => {
      if (u.sessionUpdate === "agent_message_chunk" && u.content?.type === "text") {
        reply.textContent += u.content.text;
        streamed += u.content.text.length;
      } else if (u.sessionUpdate === "agent_thought_chunk" && u.content?.type === "text") {
        thought ??= turn.insertBefore(el("div", "line thought"), reply);
        thought.textContent += u.content.text;
        streamed += u.content.text.length;
      }
    });
  status("running · esc: interrupt");

  const done = await call("session/prompt", { sessionId, prompt: [{ type: "text", text }] });

  clearInterval(timer);
  if (!reply.textContent) reply.remove();
  follow(() => {
    if (done.error) {
      live.textContent = done.error.message;
      live.classList.add("err");
    } else {
      live.textContent = [done.result.stopReason, ...counts(), usage].filter(Boolean).join(" · ");
    }
  });
  status(done.error ? "error" : "enter: send · shift+enter: new line", done.error ? "err" : "");
  running = false;
  input.disabled = false;
  input.focus();
  window.__done = true;
};

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  send();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  } else if (e.key === "ArrowUp" && !input.value && last) {
    e.preventDefault();
    input.value = last;
    grow();
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && running) {
    writer.write({ jsonrpc: "2.0", method: "session/cancel", params: { sessionId } });
    status("interrupting", "warn");
  }
});
</script>
