<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness monitor</title>
<!--
  harness monitor — a single self-contained page answering "what is this
  instance doing right now": a live board of every session (phase, current
  tool, staleness), a per-session detail view with a scrolling transcript and
  a composer, all driven by one `harness serve` instance's HTTP+SSE API. No
  build step, no external resources: open it from file:// or serve it from
  any static host. That instance must run with -cors-origin covering this
  page's origin (or "*" for local hacking). See docs/deploy-modal.md
  ("Inspecting sessions") and docs/design/monitor-mockup.html (the visual
  spec this page's tokens, grid template, and markup shapes are drawn from).

  SECURITY: the base URL and run token are persisted in this browser's
  localStorage in plaintext so a reload can reconnect. Treat this as a dev
  tool — don't host it on a shared origin with a long-lived token. Tokens are
  workspace-scoped and rotate with the workspace.

  The pure helpers below (SSE parser, activity reducer, transcript fold,
  history windowing/adaptation, DOM-key derivation, formatters, route codec)
  are unit-tested by monitor_test.mjs (run: node --test
  tools/monitor/*_test.mjs). The board AND the detail view are both live,
  fed from the SAME connect/stream/poll lifecycle — the detail view filters
  handleEvent's dispatch by session id rather than opening a second
  connection. Manual verification covers what the tests can't:
    1. Start:  HARNESS_RUN_TOKEN=t harness serve -cors-origin '*'
    2. Open this file, paste the base URL (http://localhost:4096) + token,
       Connect. -> the identity line fills in from /health, the board lists
       sessions (active first, newest activity first within each group).
    3. Drive a prompt against a session -> its row moves through
       tool/streaming/between phases, elapsed ticks once a second.
    4. Let a session sit idle for 15s -> quiet; 60s -> stalled (critical).
    5. Click a session -> the detail view opens ("#b=<base>&s=<id>"),
       fetches its history (most recent 50 messages; older ones sit behind a
       "Show N earlier messages" affordance at the top), and renders it as a
       transcript: operator/assistant entries, tool folds (running open with
       a ticking elapsed once this page has watched it start; completed
       collapsed with cmd + elapsed; a fold resolved before this page ever
       watched it shows no elapsed number rather than a fabricated one).
       Reload the URL directly (a bookmarked "#s=" deep link) -> connects,
       then opens straight into the same session. Opening a freshly created,
       never-prompted session's detail view -> the live chip stays hidden
       (idle), not a stale/default "tool running". Drive a turn that fails
       (session.error/turn.end outcome "error") or that you abort mid-turn
       -> a critical-styled "error" entry (the sanitized failure text, or
       "turn aborted") lands inline in the transcript at the point it
       occurred, and the chip drops to idle promptly once session.status
       goes idle, without waiting on the next 5s poll.
    6. Send a message from the composer (Enter to send, Shift+Enter for a
       newline) -> it appears as an operator entry IMMEDIATELY, before the
       POST even resolves (no perceived network-hop lag), reconciled — not
       duplicated — once the stream's real `message` event lands (session
       was idle) or, for a busy session, once `prompt.queued` lands. A
       non-2xx response or a network failure instead rolls the optimistic
       entry back and renders the server's own error text inline under the
       input, in critical color. The input disables only for the POST
       itself — sending into a busy session queues it rather than blocking
       on it. Once the turn actually starts running with nothing to show
       yet (no reasoning, text, tool call, or error), a quiet "Thinking…"
       indicator appears right where the reply will land, and disappears
       the instant the first token/tool/error does — a QUEUED send shows
       only its own operator entry until its turn actually starts; it never
       shows "Thinking…" prematurely.
    7. Click the breadcrumb -> back to the board; focus returns to the row
       that was opened (or the session list if that row is gone).
    8. Kill `harness serve`, wait -> connection state flips to
       "reconnecting…" with jittered backoff and the detail view (if open)
       drops back to the board rather than show increasingly stale data;
       restart -> it resyncs.
    9. Enter a wrong run token -> an inline error on the connect panel (the
       401 comes from /session, not /health, which has no auth).
   10. Reload the page -> base URL and token (from localStorage) reconnect
       automatically; a bookmarked "#b=<base>" link prefills the base URL
       field when nothing is stored yet.
   11. Toggle OS light/dark theme -> both variants stay legible.
   12. Navigate away (another site) then browser-Back into this page while
       it was connected -> if the browser served it from bfcache (the
       page's own scripts never re-run), the header re-syncs to a real
       "streaming" state rather than sitting frozen on whatever it showed
       the instant it was frozen, and an open detail view re-checks its
       history against the board summary rather than showing stale/stuck
       content.
-->
<style>
  :root {
    --surface: oklch(0.975 0.005 240);
    --surface-inset: oklch(0.955 0.006 240);
    --text-1: oklch(0.22 0.015 250);
    --text-2: oklch(0.50 0.02 250);
    --text-3: oklch(0.65 0.015 250);
    --separator: oklch(0.91 0.008 240);
    --accent: oklch(0.50 0.10 230);
    --ok: oklch(0.60 0.14 150);
    --warn: oklch(0.68 0.12 75);
    --critical: oklch(0.54 0.19 25);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --col-dot: 8px; --col-phase: 84px; --col-gap: 12px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --surface: oklch(0.19 0.012 250);
    --surface-inset: oklch(0.165 0.012 250);
    --text-1: oklch(0.93 0.005 250);
    --text-2: oklch(0.66 0.012 250);
    --text-3: oklch(0.50 0.012 250);
    --separator: oklch(0.28 0.012 250);
    --accent: oklch(0.72 0.10 230);
    --ok: oklch(0.72 0.14 150);
    --warn: oklch(0.78 0.12 80);
    --critical: oklch(0.68 0.17 25);
  } }
  :root[data-theme="light"] {
    --surface: oklch(0.975 0.005 240); --surface-inset: oklch(0.955 0.006 240);
    --text-1: oklch(0.22 0.015 250); --text-2: oklch(0.50 0.02 250);
    --text-3: oklch(0.65 0.015 250); --separator: oklch(0.91 0.008 240);
    --accent: oklch(0.50 0.10 230); --ok: oklch(0.60 0.14 150);
    --warn: oklch(0.68 0.12 75); --critical: oklch(0.54 0.19 25);
  }
  :root[data-theme="dark"] {
    --surface: oklch(0.19 0.012 250); --surface-inset: oklch(0.165 0.012 250);
    --text-1: oklch(0.93 0.005 250); --text-2: oklch(0.66 0.012 250);
    --text-3: oklch(0.50 0.012 250); --separator: oklch(0.28 0.012 250);
    --accent: oklch(0.72 0.10 230); --ok: oklch(0.72 0.14 150);
    --warn: oklch(0.78 0.12 80); --critical: oklch(0.68 0.17 25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--text-1);
    font: 14px/1.5 var(--sans);
    /* No bottom padding on body: it sits BELOW the detail view's
       position:sticky composer, so scrolling into it un-pins the composer
       (it rides up by the padding height at max scroll). Breathing room at
       the bottom is applied per-view instead — the board wants it, the
       detail view must not have anything scrollable beneath its composer. */
    padding: 32px clamp(16px, 4vw, 48px) 0;
  }
  .frame { max-width: 820px; margin: 0 auto; }
  #board { padding-bottom: 64px; }

  header.identity {
    display: grid;
    grid-template-columns: var(--col-dot) minmax(0, 1fr) auto;
    column-gap: var(--col-gap);
    align-items: baseline;
    margin-bottom: 40px;
  }
  header.identity > .hgroup { grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; min-width: 0; }
  .app-name { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  .app-name .dim { color: var(--text-3); font-weight: 400; }
  .app-name a { color: inherit; text-decoration: none; }
  .app-name a:hover { color: var(--accent); }
  .id-line { font-family: var(--mono); font-size: 12px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .conn { grid-column: 3; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .conn .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .conn.streaming .dot { background: var(--ok); }
  .conn.reconnecting .dot { background: var(--warn); }
  @media (prefers-reduced-motion: no-preference) {
    .conn.streaming .dot { animation: breathe 2.4s ease-in-out infinite; }
  }

  /* Connect affordance: shown in place of the session list until a base URL
     + token are set (localStorage empty on first visit, or cleared). */
  .connect { margin: 8px 0 28px; }
  .connect p { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
  /* Same house tone as the intro paragraph above (not critical/alarming —
     see connectPanelState's own doc comment: this explains why a carried-in
     #b= link won't be tried, it never blocks the own-origin connect). */
  .connect .cross-box-notice { color: var(--text-2); font-size: 13px; margin: -6px 0 14px; }
  .connect form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  /* :not([hidden]) is load-bearing here for the SAME reason it is on
     .detail-head .livechip (see that rule's own comment): a bare
     `.connect label { display: flex }` would silently defeat
     base-url-label.hidden = true (connectPanelState's showBaseField:
     false case) — verified against that exact class of bug earlier in
     this file's history, not a hypothetical. */
  .connect label:not([hidden]) { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3); }
  .connect input {
    background: var(--surface-inset); color: var(--text-1);
    border: 1px solid var(--separator); border-radius: 8px;
    padding: 8px 10px; font: 13px/1.4 var(--sans); min-width: 220px;
  }
  .connect input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  .connect button {
    border: 1px solid transparent; border-radius: 8px; padding: 9px 16px;
    background: var(--accent); color: oklch(0.99 0 0);
    font: 600 13.5px/1.5 var(--sans); cursor: pointer;
  }
  .connect button:hover { filter: brightness(1.08); }
  .connect button:focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }
  .connect .err { color: var(--critical); font-size: 12.5px; margin: 8px 0 0; min-height: 16px; }
  body:not(.connected) .sessions, body:not(.connected) .legend { display: none; }
  body.connected #connect-panel { display: none; }

  .sessions { display: flex; flex-direction: column; gap: 18px; }
  .group-gap { height: 10px; }
  .board-empty { color: var(--text-3); font-size: 13px; padding: 4px 0 8px; }

  .session {
    display: grid;
    grid-template-columns: var(--col-dot) var(--col-phase) minmax(0, 1fr) auto;
    column-gap: var(--col-gap);
    row-gap: 4px;
    align-items: baseline;
    outline: none;
    cursor: pointer;
    text-decoration: none; color: inherit;
  }
  .session:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; border-radius: 2px; }
  .session:hover .sid { color: var(--accent); }

  .pulse { grid-column: 1; align-self: center; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .live .pulse { background: var(--ok); }
  .quiet .pulse { background: var(--warn); }
  .bad .pulse { background: var(--critical); }
  .idle .pulse { background: transparent; border: 1.5px solid var(--separator); }

  .phase { grid-column: 2; font-weight: 600; font-size: 13px; }
  .live .phase { color: var(--ok); }
  .quiet .phase { color: var(--warn); }
  .bad .phase { color: var(--critical); }
  .idle .phase { color: var(--text-3); font-weight: 500; }

  .content { grid-column: 3; display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .sid {
    font-family: var(--mono); font-size: 12.5px; color: var(--text-2);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .detail {
    font-family: var(--mono); font-size: 12.5px; color: var(--text-1);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .idle .detail { color: var(--text-2); font-family: var(--sans); font-size: 12.5px; }
  .extra { font-size: 12px; color: var(--text-3); flex: none; }
  .elapsed {
    grid-column: 4; font-family: var(--mono); font-variant-numeric: tabular-nums;
    font-size: 12.5px; color: var(--text-2); text-align: right;
  }
  .line-2 { grid-column: 3 / 5; font-size: 12.5px; color: var(--text-2); min-width: 0; }
  .bad .line-2 { color: var(--critical); }
  .goal { color: var(--text-3); }
  .goal::before { content: "goal · "; }
  .live-goal { color: var(--ok); }

  .legend {
    margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--separator);
    font-size: 12px; color: var(--text-3); line-height: 1.7;
  }
  .legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 3px 0 0; }

  /* ── Session detail view ─────────────────────────────────────────── */
  #detail { display: none; }
  .showing-detail #board { display: none; }
  .showing-detail #detail { display: block; }

  .crumb { font-size: 12.5px; margin-bottom: 6px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  .detail-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
    margin-bottom: 36px;
  }
  .detail-head .sid-full { font-family: var(--mono); font-size: 14px; color: var(--text-1); font-weight: 600; }
  .detail-head .meta { font-family: var(--mono); font-size: 12px; color: var(--text-2); display: flex; gap: 14px; flex-wrap: wrap; }
  /* :not([hidden]) is load-bearing, not decorative: the browser's own UA
     stylesheet hides a [hidden] element via a PLAIN (non-!important)
     `[hidden] { display: none }` rule, whose origin (user-agent) is always
     lower-priority than ANY author-stylesheet rule that sets `display` on
     the same element, regardless of that rule's selector specificity — a
     bare `.livechip` rule setting `display` here would silently defeat
     `chip.hidden = true` (verified in a real Chrome tab: the element stayed
     fully visible, offsetParent non-null, computed display "inline-flex",
     with `hidden` set). That was the bug: a freshly opened, idle session's
     detail view showed the chip's stale/default text ("tool running")
     forever, because JS's own hidden=true had no visual effect. Guarding
     the display declaration with :not([hidden]) here restores it. */
  .detail-head .livechip:not([hidden]) { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); font-weight: 600; margin-left: auto; }
  .detail-head .livechip .pulse2 { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

  /* Transcript: a typographic document. Speaker rail on the left shares
     the board's column rhythm; content stays near 70ch. */
  .transcript { display: flex; flex-direction: column; gap: 26px; }
  .turn-mark {
    font-size: 11px; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .turn-mark::after { content: ""; flex: 1; border-top: 1px solid var(--separator); }

  .msg { display: grid; grid-template-columns: 84px minmax(0, 1fr); column-gap: 20px; }
  .who { font-size: 11.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3); padding-top: 2px; }
  .msg.user .who { color: var(--accent); }
  .msg.reasoning .who, .msg.reasoning .body { color: var(--text-3); }
  /* session.error/turn.end(error)/session.aborted fold into this same "msg"
     shape (see transcriptModel's "error" entry kind) so the failure lands
     inline, aligned in the content column like every other transcript
     entry — no banner/toast — styled in the mockup's critical register. */
  .msg.error .who, .msg.error .body { color: var(--critical); }
  .body { min-width: 0; max-width: 70ch; }
  /* pre-wrap: an operator/assistant reply is prose the model chose to break
     into lines (a pasted diff, a list) — collapsing those breaks the way
     plain HTML text-flow does would scramble intentional structure on a
     page whose whole point is reading a transcript accurately. */
  .body p { margin: 0 0 8px; white-space: pre-wrap; }
  .body p:last-child { margin: 0; }

  /* "Show earlier" — a plain-text affordance sharing the turn-mark's rail
     position and rhythm, not a button trying to look important. */
  .show-earlier {
    display: block; width: 100%; text-align: left; margin: 0 0 22px;
    background: none; border: none; padding: 0; cursor: pointer;
    font: 11.5px var(--sans); color: var(--text-3); text-decoration: underline;
    text-underline-offset: 2px;
  }
  .show-earlier:hover { color: var(--accent); }
  .show-earlier:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .transcript-note { font-size: 12.5px; color: var(--text-3); padding: 4px 0 8px; }
  .transcript-note.err { color: var(--critical); }
  /* The "Thinking…" pending-assistant indicator (transcriptModel's "pending"
     kind — see its own doc comment): shares .transcript-note's dim, quiet
     register — it is not an error, not a loading state, just "nothing to
     show yet for a turn that's genuinely running" — with the animation
     applied only under the SAME prefers-reduced-motion gate every other
     "something is live" animation in this file already uses (see the
     .conn.streaming .dot / .live .pulse rules below). */
  .pending-indicator { display: flex; align-items: center; gap: 2px; }

  .toolblock {
    font-family: var(--mono); font-size: 12px; line-height: 1.55;
    background: var(--surface-inset); border-radius: 6px;
    padding: 8px 12px; overflow-x: auto; white-space: pre;
    color: var(--text-2);
  }
  .toolblock .cmd { color: var(--text-1); font-weight: 600; }
  .tool-summary {
    display: flex; gap: 10px; align-items: baseline; margin: 0 0 6px;
    font-family: var(--mono); font-size: 12.5px; color: var(--text-1);
  }
  .tool-summary .t-elapsed { color: var(--text-3); font-size: 12px; margin-left: auto; }
  details.toolfold > summary { list-style: none; cursor: pointer; }
  details.toolfold > summary::-webkit-details-marker { display: none; }
  details.toolfold > summary .fold-hint { color: var(--text-3); font-size: 11.5px; }
  details.toolfold[open] > summary .fold-hint { display: none; }

  /* Composer: the one colored action in the app. Sticky under the
     transcript; sends prompt_async — idle starts a turn, busy queues with
     tool-boundary injection, and the UI says which honestly. */
  .composer {
    position: sticky; bottom: 0; margin-top: 36px;
    background: var(--surface); padding: 12px 0 14px;
    border-top: 1px solid var(--separator);
  }
  .composer form { display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea {
    flex: 1; min-width: 0; resize: none; field-sizing: content;
    max-height: 8lh; min-height: 1.5lh;
    background: var(--surface-inset); color: var(--text-1);
    border: 1px solid var(--separator); border-radius: 8px;
    padding: 9px 12px; font: 13.5px/1.5 var(--sans);
  }
  .composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer textarea:disabled { opacity: .55; }
  .composer button {
    flex: none; border: 1px solid transparent; border-radius: 8px; padding: 9px 16px;
    background: var(--accent); color: oklch(0.99 0 0);
    font: 600 13.5px/1.5 var(--sans); cursor: pointer;
  }
  .composer button:hover:not(:disabled) { filter: brightness(1.08); }
  .composer button:disabled { opacity: .55; cursor: not-allowed; }
  .composer button:focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }
  .composer .hint { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
  .composer .composer-err { color: var(--critical); font-size: 12px; margin: 6px 0 0; min-height: 14px; }

  .streaming-tail { color: var(--text-1); }
  .caret { display: inline-block; width: 7px; height: 14px; background: var(--ok); vertical-align: text-bottom; margin-left: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .live .pulse, .livechip .pulse2, .pending-indicator { animation: breathe 2.4s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes breathe { 50% { opacity: 0.35; } }
    @keyframes blink { 50% { opacity: 0; } }
  }
</style>
</head>
<body>
  <div class="frame">

    <div id="board">
      <header class="identity">
        <div class="hgroup">
          <h1 class="app-name">monitor <span class="dim" id="hdr-box">/ —</span></h1>
          <div class="id-line" id="hdr-idline">
            <span id="hdr-version">—</span>
            <span id="hdr-sync">—</span>
            <span>up <span id="hdr-uptime">—</span></span>
          </div>
        </div>
        <span class="conn" id="conn" role="status" aria-live="polite"><span class="dot" id="conn-dot"></span><span id="conn-text">disconnected</span></span>
      </header>

      <section id="connect-panel" class="connect" aria-label="Connect to a harness instance">
        <p id="connect-intro">Connect to a harness serve instance to see its sessions.</p>
        <p class="cross-box-notice" id="connect-cross-box-notice" hidden></p>
        <form id="connect-form">
          <label for="base-url" id="base-url-label">Base URL
            <input id="base-url" type="text" placeholder="http://localhost:4096" autocomplete="off" spellcheck="false" aria-describedby="connect-err" required>
          </label>
          <label for="run-token">Run token
            <input id="run-token" type="password" placeholder="run token" autocomplete="off" aria-describedby="connect-err"
                   title="stored in this browser's localStorage in plaintext — use a dev token on a private origin" required>
          </label>
          <button type="submit">Connect</button>
        </form>
        <p class="err" id="connect-err" role="alert"></p>
      </section>

      <section class="sessions" id="sessions" aria-label="Sessions"></section>

      <footer class="legend">
        <div>
          <span class="sw" style="background: var(--ok)"></span> live (streaming / tool) &nbsp;·&nbsp;
          <span class="sw" style="background: var(--warn)"></span> quiet &gt;15s &nbsp;·&nbsp;
          <span class="sw" style="background: var(--critical)"></span> stalled &gt;60s / failed &nbsp;·&nbsp;
          click a session to open it
        </div>
      </footer>
    </div>

    <div id="detail">
      <nav class="crumb"><a href="#" id="back-link">← monitor<span id="crumb-box"></span></a></nav>
      <header class="detail-head">
        <span class="sid-full" id="detail-sid-full"></span>
        <span class="meta">
          <span id="detail-msgcount"></span>
          <span>turn <span id="detail-turn-elapsed"></span></span>
          <span id="detail-toolcount"></span>
        </span>
        <span class="livechip" id="detail-livechip" hidden><span class="pulse2"></span><span id="detail-livechip-text"></span></span>
      </header>

      <section class="transcript" id="transcript" aria-label="Session transcript"></section>

      <div class="composer">
        <form id="composer-form">
          <textarea id="composer-input" rows="1" placeholder="Message the session" aria-label="Message the session"></textarea>
          <button type="submit">Send</button>
        </form>
        <p class="hint">Enter to send · Shift+Enter for a new line</p>
        <p class="composer-err" id="composer-err" role="alert"></p>
      </div>
    </div>

  </div>

<script>
"use strict";

/* ---------- pure helpers (kept small and side-effect free) ---------- */
/* TESTABLE-BEGIN — the region below is extracted verbatim by
   monitor_test.mjs and evaluated in a node:vm sandbox. Keep it pure (no
   DOM, no globals beyond Date/JSON) so the single-file page stays
   build-free while its logic is still unit-tested. */

// createSSEParser: feed it decoded stream text; it invokes onEvent({id, data})
// once per complete frame (terminated by a blank line). Handles: multi-line
// data (joined with "\n"), id lines, and comment lines beginning with ":".
// Values keep an optional single leading space stripped, per the SSE spec.
// Stateful across chunk boundaries. Copied verbatim from tools/inspector —
// an accepted duplication between these two single-file tools.
function createSSEParser(onEvent) {
  let buf = "", data = [], id = null;
  return function feed(chunk) {
    buf += chunk;
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      let line = buf.slice(0, nl);
      buf = buf.slice(nl + 1);
      if (line.endsWith("\r")) line = line.slice(0, -1);
      if (line === "") {                      // blank line: dispatch frame
        if (data.length) onEvent({ id, data: data.join("\n") });
        // Per the WHATWG SSE spec the last-event-ID buffer persists across
        // frames — it is replaced only by a new `id:` line, never cleared
        // when a frame omits one. Reset only the data buffer here.
        data = [];
        continue;
      }
      if (line[0] === ":") continue;          // comment / heartbeat
      const c = line.indexOf(":");
      let field, value;
      if (c === -1) { field = line; value = ""; }
      else {
        field = line.slice(0, c);
        value = line.slice(c + 1);
        if (value[0] === " ") value = value.slice(1);
      }
      if (field === "data") data.push(value);
      else if (field === "id") id = value;
      // "event"/"retry" fields are unused by this API and ignored.
    }
  };
}

// maxSeq returns the largest `seq` across a session list (0 if none). The
// SSE stream is opened from this cursor so replay picks up exactly what the
// REST snapshot did not yet include — no gap, no double-counting. Copied
// verbatim from tools/inspector.
function maxSeq(list) {
  let m = 0;
  for (const s of list) if (typeof s.seq === "number" && s.seq > m) m = s.seq;
  return m;
}

// partsText concatenates the text of Text parts (used for tool_result
// content, which may hold only Text and Blob parts). Copied verbatim from
// tools/inspector.
function partsText(parts) {
  if (!Array.isArray(parts)) return "";
  return parts.filter(p => p && p.type === "text").map(p => p.text || "").join("\n");
}

// summarizeArgs pulls a short, human-legible summary out of a tool call's
// (possibly JSON-string-encoded) arguments — the "go test ./server/ -race"
// half of a "Bash · go test ./server/ -race" board/transcript label. Tries
// a small set of common argument field names in priority order; returns ""
// (name-only display) when nothing recognizable is found, rather than
// dumping raw JSON into a one-line UI.
function summarizeArgs(rawArguments) {
  if (rawArguments == null) return "";
  let obj = rawArguments;
  if (typeof rawArguments === "string") {
    try { obj = JSON.parse(rawArguments); } catch { return ""; }
  }
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) return "";
  for (const key of ["command", "cmd", "query", "pattern", "path", "url"]) {
    if (typeof obj[key] === "string" && obj[key]) return obj[key];
  }
  return "";
}

// toolLabel joins a tool name and its (possibly empty) argument summary into
// the one-line "Bash · go test ./server/ -race" / "Bash" label used on both
// the board and the transcript's tool folds.
function toolLabel(name, argsSummary) {
  const n = name || "tool";
  return argsSummary ? n + " · " + argsSummary : n;
}

// fmtElapsed renders a whole-seconds duration the way the mockup's ticker
// does: "41s", "2m 34s", "1h 3m".
function fmtElapsed(seconds) {
  if (seconds == null || !isFinite(seconds)) return "—";
  const s = Math.max(0, Math.floor(seconds));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}

// fmtAgo renders a millisecond duration as a coarse "12m ago" / "1h 3m ago"
// — the format idle board rows use (no per-second ticking, so no seconds
// precision once past a minute).
function fmtAgo(ms) {
  if (ms == null || !isFinite(ms)) return "—";
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  const remM = m % 60;
  return remM > 0 ? h + "h " + remM + "m ago" : h + "h ago";
}

// hostLabel extracts a short "host[:port]" identity string from a base URL
// for the header's "monitor / <host>" line — the only per-instance identity
// available (Health carries no box name; see server/openapi.yaml). Written
// by hand (strip a leading "scheme://", cut at the first "/", "?", or "#")
// rather than `new URL(...)` so this stays usable in the TESTABLE sandbox,
// which exposes only Date/JSON (see monitor_test.mjs's extraction preamble).
// Tolerates junk: an unparseable string is returned as-is rather than
// throwing, and an empty/missing base yields "".
function hostLabel(base) {
  if (!base) return "";
  var s = String(base).replace(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//, "");
  var end = s.search(/[/?#]/);
  return end === -1 ? s : s.slice(0, end);
}

// route/unroute codec the app's URL fragment: "#b=<base>&s=<session id>",
// small explicit params (not a base64 blob) so the URL stays readable and
// bookmarkable. Values are percent-encoded; unroute tolerates junk (missing
// "#", unknown keys, malformed percent-encoding) rather than throwing.
function route(state) {
  const s = state || {};
  const params = [];
  if (s.base) params.push("b=" + encodeURIComponent(s.base));
  if (s.sessionId) params.push("s=" + encodeURIComponent(s.sessionId));
  return params.length ? "#" + params.join("&") : "#";
}

function unroute(hash) {
  const out = { base: null, sessionId: null };
  if (typeof hash !== "string") return out;
  const h = hash[0] === "#" ? hash.slice(1) : hash;
  if (!h) return out;
  for (const part of h.split("&")) {
    if (!part) continue;
    const eq = part.indexOf("=");
    const key = eq === -1 ? part : part.slice(0, eq);
    const rawVal = eq === -1 ? "" : part.slice(eq + 1);
    let val;
    try { val = decodeURIComponent(rawVal); } catch { val = rawVal; }
    if (key === "b") out.base = val;
    else if (key === "s") out.sessionId = val;
    // unknown keys, and any other malformed junk, are silently ignored.
  }
  return out;
}

// sameOriginDefaultBase decides the base URL bootstrap() should prefill
// when nothing is already stored/fragment-linked: when this page is being
// served BY a box itself (GET /monitor — see server/handlers.go's
// handleMonitor), pathname starts with "/monitor", and the box's own
// origin IS the base URL to connect to — no separate host/port to type, no
// -cors-origin needed at all (this becomes a same-origin fetch; see
// server/handlers.go's monitorContentSecurityPolicy, which scopes
// connect-src to 'self' on the assumption this holds). Every other serving
// mode this file documents (file://, a separately hosted static copy) has
// no such relationship between where the PAGE came from and where the BOX
// is, so this returns null and bootstrap()'s existing stored/fragment-
// prefill/blank behavior is unchanged — this is additive, never a
// replacement for a stored preference (see bootstrap()'s own precedence:
// storedBase still wins over this when both are present). Takes a plain
// {pathname, origin} object rather than `location` itself so it stays
// callable from this TESTABLE sandbox, which exposes no `location` (or any
// other DOM/window global) — see monitor_test.mjs's extraction preamble.
function sameOriginDefaultBase(loc) {
  var l = loc || {};
  if (typeof l.pathname !== "string" || typeof l.origin !== "string" || !l.origin) return null;
  if (l.pathname !== "/monitor" && l.pathname.indexOf("/monitor/") !== 0) return null;
  return l.origin;
}

// embeddedConnectPlan is the single source of truth for the "frictionless
// local" behavior: when this page is served embedded (sameOriginDefaultBase
// — a box's own GET /monitor), bootstrap() ATTEMPTS the connection
// immediately, with no panel shown at all, rather than making the operator
// type anything. The auth model itself is UNCHANGED by any of this — a
// token is still required by every route unless the box itself opted into
// server.Options.Unauthenticated (loopback-only — see its own doc comment);
// this only decides what the PAGE tries automatically and what it falls
// back to showing, never what the SERVER accepts.
//
// The return value composes four outcomes rather than naming one
// exclusive branch (they are not mutually exclusive in practice — see
// each one below):
//   - auto-attempt-same-origin: embedded — bootstrap() calls
//     attemptConnect(base, autoToken || "") immediately, before rendering
//     any panel. This covers BOTH the loopback-Unauthenticated case (no
//     token needed — an empty Authorization header is fine, see
//     authorized()) and the capability-URL/returning-operator case
//     (autoToken carries a real one) with the SAME call: an empty token
//     against an Unauthenticated box succeeds exactly like a correct one
//     against any box.
//   - show-full-panel: NOT embedded (file:// or a separately hosted static
//     copy) — host is unknown to this page, so there is nothing to
//     auto-attempt; the traditional two-field panel, entirely unchanged.
//   - show-token-panel: embedded, but ONLY reached if/when the auto-
//     attempt's own result is a failure (attemptConnect resolves false —
//     see bootstrap()'s revealEmbeddedPanel) — this function cannot know
//     that synchronously, so it only signals the STATIC part: showBaseField
//     false (base is fixed/known, never re-typed) is what the eventual
//     fallback panel renders as. A tunneled/non-loopback box with no
//     capability link lands here, once, after one failed silent attempt.
//   - show-cross-box-notice: crossBoxNotice is set whenever a fragment
//     base names a DIFFERENT origin than this one — independent of (and
//     composes with) the auto-attempt above: the embedded copy is pinned
//     to its own box by server/handlers.go's monitorContentSecurityPolicy
//     (connect-src 'self'), so a foreign #b= would only ever produce an
//     opaque, undiagnosable network error if tried — this never attempts
//     it, only explains it, while the SAME-origin auto-attempt (using
//     autoToken) proceeds normally regardless.
//
// autoToken precedence (mirrors extractFragmentToken's own doc comment):
// fragToken (the fresher credential, e.g. a rotated token shared via a new
// link) wins over storedToken; neither present yields null, which
// bootstrap() passes to attemptConnect as "" (still worth trying — see
// auto-attempt-same-origin above).
function embeddedConnectPlan(loc, fragToken, storedToken, fragBase) {
  var base = sameOriginDefaultBase(loc);
  if (base == null) {
    return { embedded: false, base: null, autoToken: null, showBaseField: true, crossBoxNotice: null };
  }
  var autoToken = null;
  if (typeof fragToken === "string" && fragToken) autoToken = fragToken;
  else if (typeof storedToken === "string" && storedToken) autoToken = storedToken;
  var crossBoxNotice = null;
  if (typeof fragBase === "string" && fragBase && fragBase !== base) {
    crossBoxNotice = "This embedded monitor can only watch its own instance — open " + fragBase + "/monitor instead.";
  }
  return { embedded: true, base: base, autoToken: autoToken, showBaseField: false, crossBoxNotice: crossBoxNotice };
}

// extractFragmentToken parses a run token carried in the URL fragment as
// "#t=<token>" — a capability URL an operator can paste or click without
// typing a token by hand. tools/hub (see AGENTS.md's "Development hub"
// section) established the precedent in this repo that run tokens riding
// the URL fragment is a deliberate, documented tradeoff ("run tokens ride
// the URL by design; treat a link like a secret"), not a novel hazard —
// this reuses that philosophy while keeping THIS file's own established
// encoding (small explicit params, route/unroute — see their doc comments
// — never the hub's base64 blob).
//
// Returns the adoption plan, not the side effects themselves (this stays
// pure/TESTABLE; bootstrap() applies it: localStorage.setItem + a
// history.replaceState scrub):
//   - token: the decoded value, or null if no "t" param is present.
//     Percent-decoding failures degrade to the raw text (matching
//     unroute's own tolerance) rather than throwing; an explicitly empty
//     "#t=" is also null (nothing to adopt). A repeated "t" param uses the
//     LAST occurrence, matching unroute's own last-write-wins handling of
//     repeated "b"/"s" params.
//   - cleanedHash: the SAME hash with "t" removed but every other
//     recognized param preserved (route(unroute(hash)) — minus token by
//     construction, since unroute never parsed "t" from `hash` in the
//     first place) — e.g. "#t=X&s=Y" -> "#s=Y", "#t=X" -> "#", "#s=Y"
//     (no token) -> "#s=Y" unchanged. A totally unrecognized third param
//     is dropped either way, same as unroute already tolerates (see its
//     "unknown keys ... silently ignored" comment) — this never carried
//     it forward to begin with.
function extractFragmentToken(hash) {
  var h = typeof hash === "string" ? hash : "";
  var stripped = h[0] === "#" ? h.slice(1) : h;
  var token = null;
  if (stripped) {
    var parts = stripped.split("&");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (!part) continue;
      var eq = part.indexOf("=");
      var key = eq === -1 ? part : part.slice(0, eq);
      if (key !== "t") continue;
      var rawVal = eq === -1 ? "" : part.slice(eq + 1);
      try { token = decodeURIComponent(rawVal); } catch (e) { token = rawVal; }
    }
  }
  if (token === "") token = null;
  var r = unroute(hash);
  var cleanedHash = route({ base: r.base, sessionId: r.sessionId });
  return { token: token, cleanedHash: cleanedHash };
}

// QUIET_MS/STALL_MS are `var`, not `const`: top-level `const`/`let` bindings
// live in a vm context's lexical environment, not as properties of it, so
// monitor_test.mjs's sandbox destructure would see them as undefined (see
// its extraction preamble comment). `var` (like a function declaration)
// becomes a property of the global object either way.
var QUIET_MS = 15000;
var STALL_MS = 60000;

// staleness classifies a session's live-ness purely from its activity fold:
// "idle" (never quiet/stalled — there is nothing to be silent about),
// "live" (recent event), "quiet" (>= QUIET_MS since the last event while
// busy), or "stalled" (>= STALL_MS). Boundaries are inclusive at the
// threshold (>=), matching the mockup's ">15s" / ">60s" legend read as "at
// least this stale".
function staleness(activity, nowMs) {
  if (!activity || activity.phase === "idle") return "idle";
  var last = typeof activity.lastEventAt === "number" ? activity.lastEventAt : null;
  if (last == null) return "live";
  var delta = nowMs - last;
  if (delta >= STALL_MS) return "stalled";
  if (delta >= QUIET_MS) return "quiet";
  return "live";
}

function baseActivity() {
  return { phase: "idle", tool: null, turn: null, lastEventAt: null, lastOutcome: null };
}

// reduceActivity folds one journal/live event into a session's activity
// state: phase (idle | streaming | tool | between), the current tool (if
// any), the open turn's start time + tool-call count, the last time any
// event was observed, and the most recent turn's outcome. `prev` may be
// null (a fresh session) or the result of seedActivity (a mid-turn connect,
// whose turn.startedAt is null and must stay null — never fabricated).
// `nowMs` defaults to Date.now() so callers don't have to thread it through
// for ordinary use, but tests pass an explicit value for determinism.
function reduceActivity(prev, ev, nowMs) {
  var now = typeof nowMs === "number" ? nowMs : Date.now();
  var a = Object.assign(baseActivity(), prev || {});
  if (!ev || typeof ev.type !== "string") return a;
  var next = Object.assign({}, a, { lastEventAt: now });
  switch (ev.type) {
    case "session.status":
      if (ev.status === "busy") {
        next.phase = "between";
        next.tool = null;
        next.turn = a.turn || { startedAt: now, toolCalls: 0 };
      } else {
        next.phase = "idle";
        next.tool = null;
        next.turn = null;
      }
      return next;
    case "text.delta":
    case "reasoning.delta":
      next.phase = "streaming";
      next.tool = null;
      if (!next.turn) next.turn = { startedAt: now, toolCalls: 0 };
      return next;
    case "tool.start": {
      if (!ev.tool_call) return next;
      var turn = a.turn || { startedAt: now, toolCalls: 0 };
      next.phase = "tool";
      next.tool = {
        name: ev.tool_call.name || "",
        argsSummary: summarizeArgs(ev.tool_call.arguments),
        sinceAt: now,
      };
      next.turn = { startedAt: turn.startedAt, toolCalls: turn.toolCalls + 1 };
      return next;
    }
    case "tool.end":
      // An end with no matching current tool is an unpaired/duplicate
      // event: ignore it rather than guessing at a phase change.
      if (!a.tool) return next;
      next.phase = "between";
      next.tool = null;
      return next;
    case "turn.end":
      next.lastOutcome = ev.outcome || null;
      return next;
    default:
      return next; // unrecognized event: still counts as activity (lastEventAt bump)
  }
}

// seedActivity bootstraps an activity fold from a polled Session summary —
// what a monitor connecting mid-turn knows before any live event arrives.
// A running session (state busy or goal-running) seeds an OPEN turn with a
// null startedAt: the poll snapshot carries no turn-start timestamp, and
// fabricating "now" would understate elapsed time by an unknown, possibly
// large amount. The renderer shows an em dash for that null rather than a
// wrong number.
function seedActivity(sessionSummary) {
  var s = sessionSummary || {};
  var parsed = s.last_activity_at ? Date.parse(s.last_activity_at) : NaN;
  var lastEventAt = isNaN(parsed) ? null : parsed;
  var lastOutcome = s.last_turn && s.last_turn.outcome ? s.last_turn.outcome : null;
  var running = s.state === "busy" || s.state === "goal-running";
  if (running) {
    return { phase: "between", tool: null, turn: { startedAt: null, toolCalls: 0 }, lastEventAt: lastEventAt, lastOutcome: lastOutcome };
  }
  return { phase: "idle", tool: null, turn: null, lastEventAt: lastEventAt, lastOutcome: lastOutcome };
}

// outcomeLabel renders a LastTurn.outcome value (see server/openapi.yaml)
// as the short word/phrase the idle board row's detail cell shows.
function outcomeLabel(outcome) {
  switch (outcome) {
    case "completed": return "completed";
    case "error": return "error";
    case "context_exhausted": return "context exhausted";
    case "max_turns_exceeded": return "max turns exceeded";
    case "evaluator_exhausted": return "evaluator exhausted";
    case "worker_parked": return "worker parked";
    default: return outcome || "";
  }
}

// detailFor picks the board row's detail-cell text (and whether it renders
// critical), precedence: an active/last-known tool cmd, else — while
// quiet/stalled — the raw phase word (what the session claims to be doing
// despite the silence), else — while idle — the last turn's outcome, or a
// paused-goal presentation ("worker parked" / "goal paused") when that's
// why the session is sitting idle with an active goal.
function detailFor(cssClass, activity, session) {
  if (activity && activity.tool && activity.tool.name) {
    return { text: toolLabel(activity.tool.name, activity.tool.argsSummary), critical: false };
  }
  if (cssClass === "quiet" || cssClass === "bad") {
    if (activity && activity.phase && activity.phase !== "idle") return { text: activity.phase, critical: false };
    return { text: null, critical: false };
  }
  if (cssClass === "idle") {
    var goal = session && session.goal;
    if (goal && goal.paused) {
      if (goal.pause_reason === "worker_failure") return { text: "worker parked", critical: true };
      if (goal.pause_reason === "restart") return { text: "goal paused", critical: true };
      if (goal.pause_reason === "provider-backoff") return { text: "goal paused", critical: false };
    }
    var outcome = activity && activity.lastOutcome;
    if (outcome) return { text: outcomeLabel(outcome), critical: outcome !== "completed" };
    // Lowest priority: a truly untouched session (never prompted, zero
    // durable messages) otherwise renders a plain "idle" phase word with an
    // EMPTY detail cell — indistinguishable, at a glance, from a rendering
    // failure (reported via live testing: an operator clicked one expecting
    // content and read the blank detail cell as broken). `session.messages`
    // is the session summary's own durable message count (server/
    // handlers.go's sessionJSON.Messages field) — a real 0 here is
    // unambiguous, never a missing/omitted-field guess (a session this page
    // has only seen via a live "session.created" stub, not yet a poll,
    // simply falls through to the null case below until the next poll fills
    // `messages` in — the same staleness tolerance every other composite
    // board field already has).
    if (session && session.messages === 0) return { text: "empty", critical: false };
    return { text: null, critical: false };
  }
  return { text: null, critical: false };
}

// boardModel merges the polled session list with each session's derived
// activity fold into render-ready rows: css/status class, the phase word,
// the detail cell, a non-zero-only queue count, elapsed/silence/ago timing
// (pre-formatted, plus the raw seconds/ms a 1s ticker needs to keep
// counting without recomputing the whole model), and the goal/stall line-2.
// Sort: active sessions (live/quiet/bad) before idle, most-recently-active
// first within each group; ties preserve input order (stable sort).
function boardModel(sessions, activities, nowMs) {
  var list = Array.isArray(sessions) ? sessions : [];
  var acts = activities || {};
  function activityFor(s) {
    // Duck-type rather than `instanceof Map`: the caller's Map may have
    // been constructed in a different realm (as in this file's own vm-
    // sandboxed tests), where `instanceof` against this scope's own Map
    // constructor would wrongly say no.
    var found = acts && typeof acts.get === "function" ? acts.get(s.id) : acts[s.id];
    return found || seedActivity(s);
  }
  var rows = list.map(function (s) {
    var activity = activityFor(s);
    var st = staleness(activity, nowMs); // "idle" | "live" | "quiet" | "stalled"
    var cssClass = st === "stalled" ? "bad" : st;
    var phase = cssClass === "idle" ? "idle" : (cssClass === "live" ? (activity.phase || "idle") : st);
    var detail = detailFor(cssClass, activity, s);
    var extra = typeof s.queued === "number" && s.queued > 0 ? s.queued + " queued" : null;

    var elapsed;
    if (cssClass === "idle") {
      var agoMs = activity && typeof activity.lastEventAt === "number" ? Math.max(0, nowMs - activity.lastEventAt) : null;
      elapsed = { kind: "ago", ms: agoMs, text: agoMs == null ? "—" : fmtAgo(agoMs) };
    } else if (cssClass === "live") {
      var startedAt = activity && activity.turn && typeof activity.turn.startedAt === "number" ? activity.turn.startedAt : null;
      var turnSeconds = startedAt == null ? null : Math.max(0, Math.floor((nowMs - startedAt) / 1000));
      elapsed = { kind: "turn", seconds: turnSeconds, text: turnSeconds == null ? "—" : fmtElapsed(turnSeconds) };
    } else {
      var lastEventAt = activity && typeof activity.lastEventAt === "number" ? activity.lastEventAt : null;
      var silentSeconds = lastEventAt == null ? null : Math.max(0, Math.floor((nowMs - lastEventAt) / 1000));
      elapsed = { kind: "silence", seconds: silentSeconds, text: silentSeconds == null ? "silent —" : "silent " + fmtElapsed(silentSeconds) };
    }

    var line2 = null;
    if (cssClass === "bad") {
      line2 = { kind: "note", text: "no events while busy — check the session" };
    } else if (s.goal && s.goal.condition) {
      line2 = { kind: "goal", text: s.goal.condition, live: cssClass === "live" };
    }

    var recencyAt = activity && typeof activity.lastEventAt === "number" ? activity.lastEventAt : 0;

    return {
      id: s.id,
      cssClass: cssClass,
      phase: phase,
      sid: s.id,
      detail: detail.text,
      detailCritical: detail.critical,
      extra: extra,
      elapsed: elapsed,
      line2: line2,
      recencyAt: recencyAt,
    };
  });

  rows.sort(function (x, y) {
    var xIdle = x.cssClass === "idle", yIdle = y.cssClass === "idle";
    if (xIdle !== yIdle) return xIdle ? 1 : -1;
    return y.recencyAt - x.recencyAt;
  });

  return rows;
}

// transcriptModel folds durable messages plus live (undurable) events into
// render-ready transcript entries: {kind: "turn-mark"|"operator"|"assistant"
// |"reasoning"|"tool"|"error"|"turn-empty"|"pending", ...}. Durable messages
// are the source of truth for everything they cover; `liveEvents` covers
// only what has streamed in since the durable snapshot was taken. Tool calls
// (in an assistant message) pair with their result (in the following
// tool-role message) by call_id — durable or live, whichever arrives first —
// matching message.go's own assembly rule. Streaming deltas and open tool
// folds accumulate in a separate draft that a "message" event for the same
// turn discards wholesale (superseded, not duplicated); anything still open
// at the end of `liveEvents` is the current in-progress tail. The "error"
// kind is live-only (session.error/turn.end-with-outcome-"error"/
// session.aborted carry no durable message representation of their own —
// see pushIfNewError below), so a detail view opened well after a turn
// already failed shows no error entry for it, same as this function never
// fabricating a tool fold's elapsed time it didn't itself observe.
//
// `pendingSends` (a 4th, optional input — an array of {text, clientId}) is
// the composer's own optimistic state: text the operator has submitted but
// which has NOT yet round-tripped as a real durable/stream operator message.
// Folded, purely, as {kind:"operator", pendingSend:true, clientId} entries,
// positioned one of two ways depending on whether it OPENS a new turn or is
// QUEUED behind one already running (see the turnMarkIdx/
// turnAlreadyHasOperator block near the end of this function for the exact
// mechanics):
//   - OPENING (the idle-send case): a live "session.status":"busy" has
//     already turn-marked a new turn, but no operator entry has landed for
//     it yet (durable or prompt.queued) — this pendingSend IS that turn's
//     own message, just not confirmed yet, so it is spliced right after
//     that turn-mark, BEFORE the draft (the "Thinking…" indicator/streaming
//     assistant or reasoning text). Getting this wrong — appending
//     unconditionally at the very end, trailing the draft — was a real,
//     visually-confirmed bug: submitting into an idle session briefly
//     rendered the response ABOVE the operator's own just-sent message,
//     snapping to the correct order only once the turn durably landed.
//   - QUEUED: the currently open turn already has its own operator entry
//     shown (it's mid-stream, unrelated to this pendingSend), so this one
//     trails at the very end — the newest thing on the page, regardless of
//     where that turn's own content sits, exactly like the OLD
//     unconditional behavior above, just now scoped to the case it's
//     actually correct for.
// Deduped against TWO candidates, matched by CONTAINMENT rather than strict
// equality (candidateText.indexOf(pendingText) !== -1), because a queued
// prompt's eventual delivery is template-wrapped by the engine ("OPERATOR
// MESSAGES (address these, then continue the task): 1. <text>") — the same
// tolerance prompt.queued's own placeholder dedup below already needs:
//   1. lastUserMessageText — the MOST RECENT user-role message text seen
//      across the WHOLE fold (durable `messages` AND live "message" events
//      both update it, via foldMessage's user-role branch — see below),
//      checked once at the very end of this function. Deliberately scoped
//      to only the single latest user message, not every durable message in
//      the window: a pendingSend, by construction, represents something
//      just submitted, so if it matches ANY durable message at all, that
//      match should be the most recent one — scanning the FULL 50-message
//      history window instead would risk a false positive for a short/
//      generic pendingSend text ("go", "continue") that happens to be a
//      substring of some unrelated OLDER message, silently dismissing the
//      optimistic entry before the real send even confirms. This one-slot
//      scope is also what makes reconcileDetail's own eviction safe: once a
//      reconcile refetches `messages` wholesale and trims the now-stale
//      "message" liveEvent that first confirmed a send, the FRESH snapshot's
//      own last user message re-derives the same match on the next render —
//      self-healing, not a permanent duplicate.
//   2. a LIVE "prompt.queued" event's queue_text (see that case below) — the
//      busy-session composer path's own first confirmation, matched
//      immediately as that one event is processed; prompt.queued is
//      inherently live-only (never part of durable history), so this
//      already carries no old-history false-positive risk to narrow.
// FIFO: pendingRemaining is scanned oldest-first, so the FIRST still-
// outstanding pendingSend whose text is contained in the candidate is the
// one reconciled — this is a pure, side-effect-free filter of the
// `pendingSends` argument (never mutates the caller's array), so a
// pendingSend that has already been matched simply stops appearing on the
// NEXT call with the same inputs — the caller (detailState.pendingSends)
// never needs to be told which entry matched; it can stay append-only,
// shrinking only on an explicit POST-failure removal (see wireComposer).
function transcriptModel(messages, liveEvents, turnOffset, pendingSends) {
  var msgs = Array.isArray(messages) ? messages : [];
  var evs = Array.isArray(liveEvents) ? liveEvents : [];

  // pendingRemaining: a local, mutable copy of `pendingSends` — entries are
  // spliced out of THIS copy as they're matched, never touching the
  // caller's array (keeps this function pure).
  var pendingRemaining = Array.isArray(pendingSends) ? pendingSends.slice() : [];
  function reconcilePendingSend(candidateText) {
    if (!candidateText) return;
    for (var pi = 0; pi < pendingRemaining.length; pi++) {
      var p = pendingRemaining[pi];
      if (p && p.text && candidateText.indexOf(p.text) !== -1) { pendingRemaining.splice(pi, 1); return; }
    }
  }
  // lastUserMessageText: updated by foldMessage's user-role branch for
  // EVERY user message it folds, durable or live — see reconcilePendingSend
  // usage at the end of this function for why only the latest one matters.
  var lastUserMessageText = null;

  // call_id -> tool_result, spanning every RoleTool message: durable, or a
  // live "message" event the caller hasn't migrated into `messages` yet.
  var resultsByCallID = new Map();
  // call_id -> the entry object for a durable tool_call folded from
  // `messages` (or an already-migrated "message" event) with no result yet.
  // A live tool.end for that call_id is never itself durable/journaled (see
  // Publish's EventToolEnd case in server/journal.go — only the eventual
  // tool-role message is), so it can arrive for a call that started before
  // `liveEvents` began, or before this page ever fetched history. The
  // live-event loop below patches THIS object in place when that happens,
  // rather than silently ignoring an end it has no live "started" record
  // for (see the "tool.end" case).
  var durableRunningTools = new Map();
  function collectResults(m) {
    if (m && m.role === "tool" && Array.isArray(m.parts)) {
      for (var i = 0; i < m.parts.length; i++) {
        var p = m.parts[i];
        if (p && p.type === "tool_result" && p.call_id) resultsByCallID.set(p.call_id, p);
      }
    }
  }
  for (var mi = 0; mi < msgs.length; mi++) collectResults(msgs[mi]);
  for (var ei2 = 0; ei2 < evs.length; ei2++) {
    var ev0 = evs[ei2];
    if (ev0 && ev0.type === "message" && ev0.message) collectResults(ev0.message);
  }

  var entries = [];
  var turnNum = typeof turnOffset === "number" ? turnOffset : 0;

  // liveTurnOpen is true exactly while a turn has been opened by a live
  // "session.status":"busy" event but its user message hasn't arrived yet.
  // Single-sources turn-mark emission: on the real wire, BOTH an
  // idle-dispatched prompt and a queued prompt's delivery emit
  // session.status(busy) BEFORE the "message" event that durably delivers
  // the user's own prompt text (see server/handlers.go's handlePrompt and
  // dispatchQueueHead — emitDurable(busy) precedes the Prompt() call that
  // appends + publishes the message). Without this flag, the
  // "session.status" case below and foldMessage's user-role branch each
  // pushed their OWN mark for that same turn — every turn beginning while
  // the detail view was open double-marked (and double-incremented
  // turnNum). Declared here, before the durable `messages` loop runs, so it
  // stays permanently false for every foldMessage call from that loop:
  // durable history carries no session.status events at all, so that path
  // (unaffected by this bug) is unchanged — every user message there still
  // marks its own turn. Consumed (reset to false) the moment a user message
  // actually lands, so a LATER, unrelated user message with no immediately
  // preceding busy (connecting mid-stream; a goal-internal busy/idle cycle
  // with no message of its own) still marks correctly rather than being
  // silently swallowed by a stale flag — see the "session.status" case's
  // else branch, which also resets it on any non-busy transition.
  var liveTurnOpen = false;

  // turnBusy is the pending "Thinking…" indicator's own open/closed flag —
  // deliberately a SEPARATE flag from liveTurnOpen above, which is consumed
  // (reset false) the instant the turn's user message lands, well before the
  // turn itself is done running. turnBusy instead stays true for the WHOLE
  // span a live "session.status":"busy" has been observed with no
  // subsequent "session.status":"idle" — set by the "session.status" case
  // below, read only once, after the whole fold, to decide whether a
  // trailing {kind:"pending"} entry belongs in the result (see
  // turnHasNoContentYet below). Starts false: with no live busy event
  // observed at all (e.g. a detail view opened purely against durable
  // history, or connecting mid-turn before this page ever saw the busy
  // transition), there is nothing this fold can honestly call "currently
  // open" — same "never fabricate what wasn't observed" spirit as
  // toolElapsedText/seedActivity's null startedAt elsewhere in this file.
  var turnBusy = false;

  function foldMessage(m) {
    if (!m) return;
    if (m.role === "user") {
      if (liveTurnOpen) {
        liveTurnOpen = false;
        // Backfill the real timestamp onto the turn-mark session.status
        // already opened (it had none — status events carry no wall-clock
        // content of their own) now that the message it was waiting for
        // has actually arrived, instead of leaving that mark's `at` null
        // forever.
        for (var lm = entries.length - 1; lm >= 0; lm--) {
          if (entries[lm].kind === "turn-mark") { if (!entries[lm].at) entries[lm].at = m.created_at || null; break; }
        }
      } else {
        turnNum += 1;
        entries.push({ kind: "turn-mark", turn: turnNum, at: m.created_at || null, live: false });
      }
      lastUserMessageText = partsText(m.parts);
    }
    if (m.role === "tool") return; // consumed via resultsByCallID
    var parts = Array.isArray(m.parts) ? m.parts : [];
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (!p) continue;
      if (p.type === "text") {
        // partIndex: this part's own index within m.parts — see entryKey's
        // "operator"/"assistant"/"reasoning" case for why a text and a
        // reasoning part of the SAME message (m.id shared by both) need
        // this to avoid colliding on one DOM node.
        entries.push({ kind: m.role === "user" ? "operator" : "assistant", id: m.id || null, partIndex: i, text: p.text || "", at: m.created_at || null });
      } else if (p.type === "reasoning") {
        entries.push({ kind: "reasoning", id: m.id || null, partIndex: i, text: p.text || "", at: m.created_at || null });
      } else if (p.type === "tool_call") {
        var result = resultsByCallID.get(p.call_id);
        var toolEntry = {
          kind: "tool",
          id: p.call_id,
          name: p.name || "",
          argsSummary: summarizeArgs(p.arguments),
          output: result ? partsText(result.content) : "",
          isError: !!(result && result.is_error),
          running: !result,
          at: m.created_at || null,
        };
        entries.push(toolEntry);
        if (!result) durableRunningTools.set(p.call_id, toolEntry);
      } else if (p.type === "blob") {
        entries.push({ kind: m.role === "user" ? "operator" : "assistant", id: m.id || null, partIndex: i, text: "[blob" + (p.media_type ? " " + p.media_type : "") + "]", at: m.created_at || null });
      }
    }
  }

  for (var mj = 0; mj < msgs.length; mj++) foldMessage(msgs[mj]);

  // Live tail: a draft, held separately from `entries` so a "message" event
  // that supersedes it can discard it wholesale instead of leaving
  // duplicate content behind.
  var draft = [];
  var openText = null;
  var openReasoning = null;
  var openTools = new Map();

  function resetDraft() {
    draft = [];
    openText = null;
    openReasoning = null;
    openTools = new Map();
  }

  // pushIfNewError appends a critical "error" entry for `text` to `entries`
  // (never `draft` — a failure must survive a later resetDraft(), e.g. the
  // terminal session.status idle transition right behind it on the real
  // wire), unless the immediately preceding entry is already that exact
  // same error — the dedup for session.error/turn.end's redundant pair (see
  // their cases in the event-loop switch below).
  function pushIfNewError(text) {
    var last = entries.length ? entries[entries.length - 1] : null;
    if (last && last.kind === "error" && last.text === text) return;
    entries.push({ kind: "error", id: null, text: text });
  }

  // turnHasContentSinceMark looks for a visible entry belonging to the
  // current turn — checking `draft` first, THEN `entries` backward, stopping
  // at (and not including) the most recent turn-mark. `draft` matters: a
  // tool call whose "message" event (the assistant's tool_call, then the
  // tool-role result) hasn't landed yet is represented ONLY by its live
  // tool.start/tool.end pair, which mutates an entry already sitting in
  // `draft` (see the "tool.start"/"tool.end" cases below) rather than ever
  // migrating into `entries` — checking `entries` alone would miss a
  // completed tool call still waiting on its durable message. "assistant"/
  // "tool"/"error" always count; `includeReasoningAndEmpty` additionally
  // counts "reasoning" and "turn-empty" — the two callers below need
  // opposite answers for those two kinds:
  //   - turnHadVisibleOutput (includeReasoningAndEmpty=false): the "turn
  //     completed with no output" placeholder's own check. Deliberately
  //     excludes reasoning — a turn that only thought out loud and never
  //     replied or acted IS exactly the "no output" case this exists to
  //     surface, not a false negative. "turn-empty" cannot occur here (this
  //     runs BEFORE that placeholder would ever be pushed for the CURRENT
  //     turn.end — see that case below). Live-only (mirrors pushIfNewError/
  //     the "error" kind's own scoping: there is no durable record of "this
  //     turn produced no output" to reconstruct from a `messages`-only
  //     history fetch, so a detail view opened well after such a turn shows
  //     nothing special for it, same as it shows no error entry for a
  //     long-past failure).
  //   - the pending "Thinking…" indicator's own derivation (see turnBusy,
  //     read once at the very end of this function): includes reasoning — a
  //     turn that has started thinking out loud is no longer silent, even
  //     though it hasn't replied yet, the OPPOSITE of turnHadVisibleOutput's
  //     exclusion above — and "turn-empty", so once turn.end(completed) has
  //     already pushed that placeholder for this turn (see the "turn.end"
  //     case below), the pending indicator stops claiming "nothing yet" even
  //     though session.status(idle) — which flips turnBusy false — may not
  //     have been processed yet on the real wire's own ordering (turn.end
  //     precedes it). Without this, the two placeholders could both render
  //     for one beat.
  function turnHasContentSinceMark(includeReasoningAndEmpty) {
    for (var d = draft.length - 1; d >= 0; d--) {
      var dk = draft[d].kind;
      if (dk === "assistant" || dk === "tool") return true;
      if (includeReasoningAndEmpty && dk === "reasoning") return true;
    }
    for (var i = entries.length - 1; i >= 0; i--) {
      var k = entries[i].kind;
      if (k === "turn-mark") return false;
      if (k === "assistant" || k === "tool" || k === "error") return true;
      if (includeReasoningAndEmpty && (k === "reasoning" || k === "turn-empty")) return true;
    }
    return false;
  }

  for (var ek = 0; ek < evs.length; ek++) {
    var ev = evs[ek];
    if (!ev || typeof ev.type !== "string") continue;
    switch (ev.type) {
      case "session.status":
        resetDraft();
        if (ev.status === "busy") {
          turnNum += 1;
          entries.push({ kind: "turn-mark", turn: turnNum, at: null, live: true });
          liveTurnOpen = true; // consumed by foldMessage's user-role branch above
          turnBusy = true;
        } else {
          // Bounds how long an unconsumed liveTurnOpen can linger: a busy
          // cycle with no discrete user message (e.g. a goal-loop internal
          // turn) resets here at its idle transition, so it can never leak
          // into suppressing a later, unrelated user message's own mark.
          liveTurnOpen = false;
          turnBusy = false;
        }
        break;
      case "message":
        resetDraft();
        // A "message" event whose role is "user" durably delivers a prompt
        // that may have rendered earlier as an optimistic "prompt.queued"
        // placeholder (below) while it waited its turn. Drop the oldest
        // still-queued placeholder — FIFO, since the wire carries no shared
        // id between prompt.queued's queue_id and this event's message id —
        // so the real, turn-marked message replaces it instead of
        // duplicating it.
        if (ev.message && ev.message.role === "user") {
          for (var qi = 0; qi < entries.length; qi++) {
            if (entries[qi].kind === "operator" && entries[qi].queued) { entries.splice(qi, 1); break; }
          }
        }
        // pendingSends reconciliation for a "message" event is NOT wired
        // here — foldMessage (called just below) already tracks
        // lastUserMessageText for every user message it folds, durable or
        // live alike, and this function reconciles against that ONE value
        // once at the very end (see its own doc comment for why "the
        // single latest user message" is the right scope, not every event
        // individually).
        if (ev.message) foldMessage(ev.message);
        break;
      case "prompt.queued":
        // Optimistic-but-honest: this fires only once the server has
        // durably accepted the composer's prompt_async POST (see
        // server/journal.go's publishQueue), so it is not a client-side
        // phantom — it is the earliest the stream itself confirms the
        // message. Pushed straight into `entries`, not the draft, so an
        // unrelated resetDraft() elsewhere (e.g. the current turn's own
        // streaming text completing) cannot make it vanish before delivery.
        entries.push({ kind: "operator", id: null, text: ev.queue_text || "", queued: true, queueId: ev.queue_id != null ? ev.queue_id : null, at: null });
        // This is the busy-session composer path's first real confirmation
        // of the send — reconcile any still-optimistic pendingSend for the
        // SAME text here too (prompt.queued events never route through
        // foldMessage, unlike "message" above, so this is its own call
        // site rather than falling out of foldMessage's user-role branch).
        if (pendingRemaining.length) reconcilePendingSend(ev.queue_text || "");
        break;
      case "text.delta":
        if (!openText) { openText = { kind: "assistant", id: null, text: "", streaming: true }; draft.push(openText); }
        openText.text += ev.text || "";
        break;
      case "reasoning.delta":
        if (!openReasoning) { openReasoning = { kind: "reasoning", id: null, text: "", streaming: true }; draft.push(openReasoning); }
        openReasoning.text += ev.text || "";
        break;
      case "tool.start":
        if (ev.tool_call && ev.tool_call.call_id) {
          var t = {
            kind: "tool", id: ev.tool_call.call_id, name: ev.tool_call.name || "",
            argsSummary: summarizeArgs(ev.tool_call.arguments),
            output: "", isError: false, running: true,
          };
          draft.push(t);
          openTools.set(ev.tool_call.call_id, t);
          openText = null;
          openReasoning = null;
        }
        break;
      case "tool.end":
        if (ev.tool_call && ev.tool_call.call_id) {
          var callID = ev.tool_call.call_id;
          var running = openTools.get(callID) || durableRunningTools.get(callID);
          // No matching open (live-started or durable-running) tool: an
          // unpaired/duplicate end. Ignore it rather than guessing which
          // fold it belongs to.
          if (running) {
            running.running = false;
            running.output = partsText(ev.output);
            running.isError = !!ev.is_error;
            openTools.delete(callID);
            durableRunningTools.delete(callID);
          }
        }
        break;
      // session.error/turn.end(error)/session.aborted all fold into the SAME
      // "error" entry kind (rendered via buildMsgEl/updateMsgEl like any
      // other message, styled critical via CSS's .msg.error rule). See
      // server/handlers.go's runPrompt/runGoal: a genuine turn failure
      // ALWAYS emits session.error immediately followed by turn.end with
      // the identical (sanitized) error text — pushIfNewError's dedup
      // means whichever of the two arrives second is a no-op, while EITHER
      // one arriving alone (a page connecting mid-failure, replaying only
      // one of the two) still folds its own entry.
      case "session.error":
        pushIfNewError(ev.error || "");
        break;
      case "turn.end":
        if (ev.outcome === "error" && ev.error) {
          pushIfNewError(ev.error);
        } else if (ev.outcome === "completed" && !turnHasContentSinceMark(false)) {
          // A turn can legitimately complete with nothing to show: no
          // assistant text, no tool call, no error (observed with an
          // exhausted scripted provider; rare but real with an actual
          // model too). Without this, the transcript renders NOTHING for
          // that turn beyond its own operator prompt — indistinguishable
          // from the turn having silently vanished. A dim, turn-mark-
          // register placeholder (not the critical "error" register: this
          // is not a failure) says so plainly instead.
          entries.push({ kind: "turn-empty", turn: turnNum, text: "turn completed with no output" });
        }
        break;
      case "session.aborted":
        // No dedup needed: unlike session.error/turn.end, a deliberate
        // abort (see runPrompt's context.Canceled branch) never pairs with
        // a second event carrying the same text.
        entries.push({ kind: "error", id: null, text: "turn aborted" });
        break;
      default:
        break;
    }
  }

  // Reconcile pendingSends against the single most recent user message seen
  // across the WHOLE fold (durable history's own tail, superseded by any
  // fresher live "message" event — see lastUserMessageText/foldMessage's own
  // doc comments for why exactly one candidate, not the full window, is the
  // right scope). prompt.queued's own reconciliation already happened
  // earlier, inline, as that event was processed — this is only the
  // "message"-event path's single deferred check.
  if (pendingRemaining.length) reconcilePendingSend(lastUserMessageText);

  // Does the CURRENT open turn already have its own operator entry showing
  // (durable, via foldMessage's user-role branch, or a "prompt.queued"
  // placeholder — both push kind:"operator" straight into `entries`)? Scan
  // backward from the end of `entries`, stopping at (not including) the
  // most recent turn-mark — same backward-scan shape as
  // turnHasContentSinceMark just above, but checking for "operator"
  // specifically, since that is what distinguishes the two pendingSend
  // scenarios documented on this function's own pendingSends comment:
  //   - IDLE-send: a live "session.status":"busy" already pushed a new
  //     turn-mark (liveTurnOpen), but the user message that would carry an
  //     "operator" entry for THIS turn hasn't landed yet — the pendingSend
  //     IS that message, just not durable/confirmed yet. turnMarkIdx points
  //     at that mark with turnAlreadyHasOperator still false.
  //   - BUSY-send (queued behind a running turn): the running turn's own
  //     operator entry already landed (real message or prompt.queued) well
  //     before this NEW pendingSend was even added — turnAlreadyHasOperator
  //     is true, so this pendingSend belongs to some turn that hasn't
  //     opened yet, not the one currently running.
  // If `entries` carries no turn-mark at all (nothing has ever opened),
  // turnMarkIdx stays -1 and there is nothing to "open" — a pendingSend
  // here is the very first thing on the page either way, so trailing vs.
  // leading is unobservable and the code below leaves it to the trailing
  // path unchanged.
  var turnMarkIdx = -1;
  var turnAlreadyHasOperator = false;
  for (var bi = entries.length - 1; bi >= 0; bi--) {
    if (entries[bi].kind === "turn-mark") { turnMarkIdx = bi; break; }
    if (entries[bi].kind === "operator") turnAlreadyHasOperator = true;
  }
  // Only the FIRST (oldest, FIFO — pendingRemaining is scanned/shifted in
  // submission order throughout this function) still-outstanding
  // pendingSend can ever be the one that opened the CURRENT turn; a second,
  // later pendingSend queued up behind it belongs to a turn this fold
  // hasn't opened yet, so it stays in the ordinary trailing group either
  // way (see pendingSendEntries below).
  var openingPendingSend = turnMarkIdx !== -1 && !turnAlreadyHasOperator && pendingRemaining.length
    ? pendingRemaining.shift()
    : null;
  // Spliced right after the turn-mark it opens — i.e. appended to `entries`
  // itself, BEFORE the draft/pending-indicator/trailing groups below — so
  // the render order is [turn-mark][operator (pending)][Thinking…/
  // streaming draft], matching what a real idle-session send must look
  // like: the operator's own message precedes the response it triggered,
  // never the other way around.
  var openedEntries = openingPendingSend
    ? entries.concat([{ kind: "operator", id: null, text: openingPendingSend.text, pendingSend: true, clientId: openingPendingSend.clientId, at: null }])
    : entries;

  // The pending "Thinking…" indicator, if this turn is genuinely still open
  // (turnBusy) and has shown nothing yet (turnHasContentSinceMark(true) is
  // false) — computed fresh from the fold, not from any externally-supplied
  // busy/idle flag (see turnBusy's own doc comment) — sits right after the
  // open turn's own draft tail, BEFORE any trailing pendingSend entries: it
  // belongs to the turn that is actually running, never to a pendingSend
  // still waiting to even be dispatched (see the "queued behind a running
  // turn" scenario in monitor_test.mjs).
  var pendingIndicator = turnBusy && !turnHasContentSinceMark(true) ? [{ kind: "pending" }] : [];

  // Trailing pendingSend entries: whatever's left in pendingRemaining after
  // every reconciliation above (including the opening splice just above)
  // had its chance to match/place one. Always last — the newest thing on
  // the page, regardless of any currently-open turn's own content above
  // it — this is the QUEUED case: a send made while a turn that already has
  // its own operator entry is still running.
  var pendingSendEntries = pendingRemaining.map(function (p) {
    return { kind: "operator", id: null, text: p.text, pendingSend: true, clientId: p.clientId, at: null };
  });

  return openedEntries.concat(draft).concat(pendingIndicator).concat(pendingSendEntries);
}

// HISTORY_WINDOW is the number of most-recent durable messages the detail
// view renders on open; historyWindow's "show earlier" affordance expands
// past it on request. 50 messages runs roughly 15-25 turns deep for a
// typical tool-heavy session — enough to orient the operator immediately
// without laying out an entire long-running transcript by default (see the
// plan's "no virtualization heroics").
var HISTORY_WINDOW = 50;

// historyWindow trims a full durable message list down to its most recent
// `limit` messages (the detail view's default view), or returns it
// untouched when `limit` is null/undefined/Infinity/>= the list length (the
// "show earlier" expanded state). hiddenTurns counts the user-role messages
// among the dropped prefix so the caller can start transcriptModel's turn
// numbering (its `turnOffset` parameter) where the window begins, instead
// of every windowed view restarting at "turn 1" for what may be turn 41.
function historyWindow(messages, limit) {
  var msgs = Array.isArray(messages) ? messages : [];
  if (limit == null || !isFinite(limit) || limit >= msgs.length) {
