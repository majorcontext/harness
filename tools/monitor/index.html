    return { window: msgs, hiddenCount: 0, hiddenTurns: 0 };
  }
  var cut = msgs.length - limit;
  var hidden = msgs.slice(0, cut);
  var hiddenTurns = 0;
  for (var i = 0; i < hidden.length; i++) if (hidden[i] && hidden[i].role === "user") hiddenTurns++;
  return { window: msgs.slice(cut), hiddenCount: hidden.length, hiddenTurns: hiddenTurns };
}

// adaptHistory turns GET /session/{id}/message's raw response (an array
// mixing real messages with messagePlaceholder objects — see
// server/handlers.go's handleMessages doc comment on why one unmarshalable
// message must not take the whole endpoint down) into the message list
// transcriptModel expects, plus a count of entries that had to be dropped
// because they carry no renderable parts. Never throws on malformed input —
// a non-array/empty response degrades to an empty, fully-available history
// rather than crashing the detail view.
function adaptHistory(raw) {
  var list = Array.isArray(raw) ? raw : [];
  var messages = [];
  var unavailable = 0;
  for (var i = 0; i < list.length; i++) {
    var m = list[i];
    if (m && Array.isArray(m.parts)) messages.push(m);
    else unavailable++;
  }
  return { messages: messages, unavailable: unavailable };
}

// countKind counts how many transcriptModel entries match the given kind —
// used for the detail header's tool-call count.
function countKind(entries, kind) {
  var list = Array.isArray(entries) ? entries : [];
  var n = 0;
  for (var i = 0; i < list.length; i++) if (list[i] && list[i].kind === kind) n++;
  return n;
}

// liveMessageCount counts "message" events in a liveEvents buffer. Each one
// durably adds exactly one message that the next GET /session/{id}/message
// fetch would also report, so a detail header's msgCount = messages.length
// + this, without waiting on a re-fetch to stay accurate.
function liveMessageCount(liveEvents) {
  var evs = Array.isArray(liveEvents) ? liveEvents : [];
  var n = 0;
  for (var i = 0; i < evs.length; i++) if (evs[i] && evs[i].type === "message") n++;
  return n;
}

// detailUnderpopulated (TESTABLE) is the self-heal predicate: given the
// session's own board summary message count (sessionJSON's "messages" —
// server/handlers.go's len(sess.History()), the SAME durable count GET
// /session/{id}/message would report) and how many durable messages the
// currently-open detail view has actually rendered (detailState.messages
// .length — NOT + liveMessageCount(detailState.liveEvents); live-only
// content legitimately has no board-summary backing yet), decides whether
// the detail view has fallen behind in the one way that can never
// self-correct on its own: it rendered NOTHING at all while the summary
// proves durable history exists. pollOnce (every POLL_MS, already
// fetching this summary regardless) and enterDetail's own fetch-resolved
// callback (closing the gap immediately, without waiting a full poll
// interval) both call this and trigger reconcileDetail() on true — see
// their call sites' own doc comments for why this closes the deep-link
// history race even when its exact trigger can't be pinned down (finding
// 3 in reconcileDetail's own doc comment).
//
// Deliberately NOT "rendered < summary" in general: a session mid-live-
// turn legitimately has the summary's count run ahead of
// detailState.messages for seconds at a time (detailState.messages only
// advances on enterDetail/reconcileDetail's own re-fetch, never on a live
// event) — that lag is normal, already visible via liveEvents, and
// closes itself the next time ANY reconcile trigger fires; treating it as
// "stuck" would re-fetch on every single poll for every session someone
// happens to be watching mid-turn. "Rendered zero while the summary says
// otherwise" has no such false-positive: a genuinely fresh, never-
// prompted session has summary 0 too, so this only fires on the one
// combination that means the initial load never landed.
function detailUnderpopulated(summaryMessages, renderedMessages) {
  var summary = typeof summaryMessages === "number" && isFinite(summaryMessages) ? summaryMessages : 0;
  var rendered = typeof renderedMessages === "number" && isFinite(renderedMessages) ? renderedMessages : 0;
  return rendered === 0 && summary > 0;
}

// entryKey derives a stable DOM-reconciliation key for a transcriptModel
// entry, so the detail view can patch existing nodes in place instead of
// rebuilding the transcript on every delta (mirrors boardModel's row keying
// via session id). Turn marks key by turn number; tool folds key by
// call_id, which stays the same whether the fold is running or resolved,
// durable or live-started — the same object gets patched, not replaced,
// when a tool.end lands. Settled messages key by their durable id PLUS
// partIndex — NOT id alone: a single durable message can carry MULTIPLE
// renderable parts (foldMessage's own loop — e.g. a Reasoning part followed
// by a Text part, both stamped with the SAME m.id), so keying by id alone
// collided the reasoning entry and the assistant entry from one message
// onto the SAME map slot. syncTranscript's reuse-by-key then patched
// whichever of the two entries it folded LAST onto the node the OTHER one
// built — updateMsgEl only ever touches the body/caret, never the "who"
// label or the kind-derived CSS class set at buildMsgEl time — so the node
// kept its first entry's label (e.g. "reasoning") while showing the last
// entry's text (e.g. the assistant reply): a real, visually-confirmed bug,
// not hypothetical (a reasoning part always precedes a text part in
// foldMessage's own part loop, so the label lost this race deterministically
// every time, not just occasionally). partIndex disambiguates the two; the
// draft's singleton open-text/open-reasoning entries (transcriptModel holds
// at most one of each) and not-yet-durable queued placeholders key by a
// fixed per-kind (or per-queue-id) tag instead, since they have no id yet.
// `index` is a last-resort tiebreaker never expected to matter in practice.
function entryKey(entry, index) {
  if (!entry) return "idx:" + index;
  switch (entry.kind) {
    case "turn-mark": return "turn:" + entry.turn;
    case "tool": return "tool:" + entry.id;
    // error entries have no durable id of their own (session.error/turn.end/
    // session.aborted are live-only, never part of durable `messages` — see
    // pushIfNewError's doc comment); `entries` only ever grows (nothing is
    // spliced out ahead of an error entry the way a queued placeholder can
    // be), so an error entry's position among the full folded array is
    // stable across re-renders, same as this function's own "idx:" fallback
    // below — named explicitly here rather than falling through to default
    // so this stability isn't accidental.
    case "error": return "error:" + index;
    // At most one "no output" placeholder can ever exist per turn (see
    // transcriptModel's turnHadVisibleOutput/turn.end case), so keying by
    // turn number is both stable across re-renders and, unlike "idx:",
    // never ambiguous if something else were ever inserted before it.
    case "turn-empty": return "turn-empty:" + entry.turn;
    // At most one pending entry can ever exist per transcriptModel call (it
    // reflects the ONE currently-open turn — see turnBusy's own doc
    // comment), so — like turn-empty above — a fixed tag is both stable
    // across re-renders and unambiguous: one DOM node is created once and
    // then only removed (once content arrives) or repositioned, never
    // rebuilt on every 1s tick.
    case "pending": return "pending";
    case "operator":
    case "assistant":
    case "reasoning":
      // pendingSend entries key by their clientId — independent of, and
      // checked before, the `queued` case just below: a pendingSend and a
      // prompt.queued placeholder are two distinct, never-simultaneous
      // mechanisms for the SAME underlying send (see transcriptModel's own
      // doc comment on pendingSends), so this ordering never matters in
      // practice, but is explicit rather than relying on the two flags
      // happening never to collide.
      if (entry.pendingSend) return "pendingSend:" + entry.clientId;
      if (entry.queued) return "queued:" + (entry.queueId != null ? entry.queueId : "idx:" + index);
      if (entry.id) return "msg:" + entry.id + ":" + (typeof entry.partIndex === "number" ? entry.partIndex : 0);
      return "draft:" + entry.kind;
    default: return "idx:" + index;
  }
}

// turnMarkAgoText renders a settled turn-mark's "· Xm ago" suffix (empty
// string when `entry.at` is missing/unparseable, or while the turn is still
// current, i.e. entry.at is null) from an explicit nowMs. Pure (Date.parse
// + fmtAgo only), so it lives here rather than beside its two DOM-touching
// callers (entrySignature/updateTurnMarkEl, in the detail-view section
// below) — factored out precisely so BOTH of them compute the IDENTICAL
// string from the SAME nowMs on a given render pass, rather than one
// quietly calling Date.now() a beat later and drifting from the other by a
// tick's worth of skew, AND so the "does this value actually change as
// nowMs advances" logic (the whole point of entrySignature keying on it —
// see that function's own comment) is unit-testable on its own.
function turnMarkAgoText(entry, nowMs) {
  if (!entry || !entry.at) return "";
  var ms = Date.parse(entry.at);
  if (isNaN(ms)) return "";
  return fmtAgo(Math.max(0, nowMs - ms));
}

// keepsLiveEventAfterReconcile decides whether a detailState.liveEvents
// entry survives reconcileDetail's post-snapshot filter (see that
// function's own doc comment, in the detail-view section below, for the
// full reasoning). Two rules, in order:
//
//   1. session.error / turn.end / session.aborted are ALWAYS kept,
//      unconditionally, regardless of seq or snapSeq. These three are
//      durable (server/journal.go's emitDurable assigns them a seq) but —
//      unlike every OTHER durable event this file handles — have NO
//      GET /session/{id}/message representation at all: they are journal
//      records, not message.Message objects, so a fresh /message snapshot
//      can never reconstruct one. transcriptModel's "error" entry kind
//      (pushIfNewError) is folded EXCLUSIVELY from these three live events
//      — dropping one once its seq fell behind snapSeq would silently
//      erase the one piece of the transcript an operator most needs to
//      see, discovered the hard way: an earlier version of this rule
//      dropped them like anything else durable, which made a detail view
//      whose liveEvents crossed DETAIL_LIVE_EVENTS_CAP while rendering a
//      failed turn's error entry lose that entry the instant
//      reconcileDetail's cap trigger fired. transcriptModel's own
//      pushIfNewError dedup (against the immediately preceding entry)
//      already guards the one case that could otherwise duplicate one of
//      these post-reconcile: session.error paired with its own matching
//      turn.end. The cost is a small, bounded exception to
//      DETAIL_LIVE_EVENTS_CAP's growth bound — at most a couple of these
//      per TURN, never per delta, nowhere near the unbounded-per-delta
//      growth finding 3 exists to cap.
//   2. Everything else: kept iff `ev` carries a numeric `seq` strictly
//      greater than `snapSeq`. Every OTHER durable event type either opens/
//      resets a turn (session.status — transcriptModel recomputes
//      liveTurnOpen fresh on every call, so dropping a stale one never
//      loses a turn-mark: the message that would have consumed it marks
//      its own turn instead) or IS itself directly superseded by a
//      "message" event the fresh snapshot now already contains (message;
//      prompt.queued, whose only downside if dropped un-delivered is a
//      brief, self-healing optimistic-UI gap until the real "message"
//      event lands). A transient, non-journaled live event (text.delta,
//      reasoning.delta, tool.start, tool.end, compaction_failed —
//      publishLive's events) never carries a seq at all, and is therefore
//      ALWAYS dropped by this branch — there is no way to place it
//      relative to snapSeq's boundary, and keeping it on a guess risks
//      resurrecting the exact stale-duplicate problem reconcileDetail
//      exists to prevent.
//
// Factored out as a pure predicate (reconcileDetail itself is DOM/fetch-
// wiring, outside this TESTABLE region) so this boundary rule — the crux
// of both the reconnect-gap fix and the buffer-cap fix — is unit-testable
// independent of any network/DOM plumbing.
function keepsLiveEventAfterReconcile(ev, snapSeq) {
  if (!ev) return false;
  if (ev.type === "session.error" || ev.type === "turn.end" || ev.type === "session.aborted") return true;
  return typeof ev.seq === "number" && ev.seq > snapSeq;
}

/* TESTABLE-END */

// DETAIL_LIVE_EVENTS_CAP bounds detailState.liveEvents (a detail view's live
// tail buffer): transcriptModel refolds the ENTIRE buffer on every
// tick/delta (see renderDetail), so an unbounded buffer makes a long-lived
// detail view's per-render cost grow without bound across a session's
// lifetime. handleDetailEvent triggers reconcileDetail() once the buffer
// exceeds this — see reconcileDetail's own doc comment for how that
// actually shrinks it back down (this is only the trigger threshold, not
// the mechanism). `var`, not `const` — see window.__monitorTuning below,
// which overrides it the same way it overrides QUIET_MS/STALL_MS.
var DETAIL_LIVE_EVENTS_CAP = 500;

/* ---------- app state + DOM wiring (board live; detail view stays static
   until the next step) ----------

   State shape:
     base, token: the connected instance (mirrors localStorage once set).
     health: raw GET /health body (identity: version/vcs_revision/
       session_sync/started_at), or null before the first successful connect.
     sessions: Map<id, Session> — the latest GET /session poll, replaced
       wholesale each 5s tick (composite state/queue/goal fields the SSE
       stream does not carry — see the plan's Connection lifecycle section).
     activities: Map<id, activity> — reduceActivity's fold, updated by every
       SSE event; boardModel seeds a missing entry from seedActivity(session)
       so a session polled but never yet seen on the stream still renders.
     lastSeq, backoff, running, abort, streamTimer, pollTimer, tickTimer:
       the connection lifecycle's own bookkeeping (hub/inspector's pattern). */
var LS_BASE = "harness.monitor.base";
var LS_TOKEN = "harness.monitor.token";
var POLL_MS = 5000;
var TICK_MS = 1000;
var BACKOFF_MIN = 500;
var BACKOFF_MAX = 10000;

// Test-only tuning seam: tools/monitor/e2e's jsdom driver sets
// window.__monitorTuning = { QUIET_MS, STALL_MS, DETAIL_LIVE_EVENTS_CAP,
// BACKOFF_MIN, BACKOFF_MAX } (via JSDOM's beforeParse, so it lands before
// this inline script ever runs) to move these values off their production
// defaults (staleness thresholds 15s/60s, live-events cap 500, reconnect
// backoff 500ms-10s) to whatever a scripted test needs to cross inside a
// CI-sane budget — shrunk for staleness/the cap, WIDENED for backoff (the
// reconnect-gap-heal scenario needs a deterministically wide window between
// a real server-side kill/restart and the page's own reconnect attempt to
// reliably land a "the durable turn completed while this page was still in
// backoff" race, rather than depending on exact wall-clock luck) — without
// touching the values any real deployment sees; nothing in production ever
// sets window.__monitorTuning, so this is a no-op there. Kept outside
// TESTABLE-BEGIN/END (monitor_test.mjs's vm sandbox exposes no `window`),
// and — unlike the QUIET_MS/STALL_MS/DETAIL_LIVE_EVENTS_CAP declarations
// above, which sit right after TESTABLE-END — placed HERE, after
// BACKOFF_MIN/BACKOFF_MAX's own declarations: applying an override before
// the `var` statement that assigns its production default would just get
// silently clobbered back to that default a few lines later (`var`
// declarations hoist, but the ASSIGNMENT runs in source order). Applied
// once, before bootstrap()/any staleness() call or state's own `backoff:
// BACKOFF_MIN` initializer just below, which must see the FINAL value.
if (typeof window !== "undefined" && window.__monitorTuning) {
  if (typeof window.__monitorTuning.QUIET_MS === "number") QUIET_MS = window.__monitorTuning.QUIET_MS;
  if (typeof window.__monitorTuning.STALL_MS === "number") STALL_MS = window.__monitorTuning.STALL_MS;
  if (typeof window.__monitorTuning.DETAIL_LIVE_EVENTS_CAP === "number") DETAIL_LIVE_EVENTS_CAP = window.__monitorTuning.DETAIL_LIVE_EVENTS_CAP;
  if (typeof window.__monitorTuning.BACKOFF_MIN === "number") BACKOFF_MIN = window.__monitorTuning.BACKOFF_MIN;
  if (typeof window.__monitorTuning.BACKOFF_MAX === "number") BACKOFF_MAX = window.__monitorTuning.BACKOFF_MAX;
  // POLL_MS: shrunk by the reconnect-gap-heal e2e scenario so a REAL poll
  // tick reliably lands during a brief server-side outage window and
  // genuinely advances state.lastSeq past it — the actual finding-1
  // mechanism (see reconcileDetail's doc comment) — rather than leaving
  // "did a poll happen to land in that window" to wall-clock chance.
  if (typeof window.__monitorTuning.POLL_MS === "number") POLL_MS = window.__monitorTuning.POLL_MS;
}

// __monitorDebug exposes read-only test hooks for state this script keeps
// closured (detailState.liveEvents.length is not otherwise reachable from
// outside this <script>) — same "nothing in production ever reads this"
// contract as window.__monitorTuning above; e2e's real_e2e.mjs uses this to
// assert liveEvents actually stays bounded after a reconcile, rather than
// merely trusting the cap was applied. liveEventsPeakLength reads
// detailState.peakLiveEventsLength (maintained by handleDetailEvent — see
// its own comment) rather than sampling liveEventsLength() on a polling
// timer: a real scripted turn with no bash sleep can cross a small tuned
// cap and get reconciled back down within a single JS microtask, entirely
// between two 25ms poll samples — the peak counter can never miss that,
// since it is updated synchronously on every push, before any reconcile
// trim has a chance to run.
if (typeof window !== "undefined") {
  window.__monitorDebug = {
    liveEventsLength: function () { return detailState ? detailState.liveEvents.length : null; },
    liveEventsPeakLength: function () { return detailState ? detailState.peakLiveEventsLength : null; },
  };
}

var state = {
  base: "", token: "",
  health: null,
  sessions: new Map(),
  activities: new Map(),
  lastSeq: 0, backoff: BACKOFF_MIN,
  running: false, abort: null, streamTimer: null, pollTimer: null, tickTimer: null,
};

// boardDom holds the keyed row reconciliation state: one entry per session
// id, `sig` gating the (cheap but not free) DOM patch so a render pass that
// changes nothing for a row touches nothing. See syncBoard.
var boardDom = { rows: new Map(), gapEl: null, emptyEl: null };

// detailState is non-null exactly while the detail view is showing a
// session, and holds everything that view needs that isn't already global
// (state.sessions/activities cover the session's composite/activity fold;
// this covers the transcript's own history + live tail + DOM keys). A
// fresh object replaces it wholesale on every enterDetail — never mutated
// in place across sessions — so a slow-resolving history fetch for a
// session the operator has since navigated away from can detect that via
// `loadToken` and discard its result instead of clobbering the new view.
// See enterDetail/exitDetail/handleDetailEvent.
var detailState = null;
var detailLoadCounter = 0;

var baseInput = document.getElementById("base-url");
var tokenInput = document.getElementById("run-token");
var connectForm = document.getElementById("connect-form");
var connectErr = document.getElementById("connect-err");
var connectBtn = connectForm.querySelector("button[type=submit]");
var sessionsEl = document.getElementById("sessions");
var connEl = document.getElementById("conn");
var connText = document.getElementById("conn-text");

/* ---------- HTTP ---------- */

function api(method, path, body) {
  var opts = { method: method, headers: { Authorization: "Bearer " + state.token } };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  return fetch(state.base + path, opts);
}

/* ---------- identity + connection-state header ---------- */

function renderIdentity() {
  var h = state.health || {};
  document.getElementById("hdr-box").textContent = "/ " + (hostLabel(state.base) || "—");
  document.getElementById("hdr-version").textContent = "harness " + (h.vcs_revision || h.version || "—");
  document.getElementById("hdr-sync").textContent = h.session_sync ? "session_sync " + h.session_sync : "—";
  renderUptime(Date.now());
}

function renderUptime(nowMs) {
  var h = state.health;
  var startedMs = h && h.started_at ? Date.parse(h.started_at) : NaN;
  document.getElementById("hdr-uptime").textContent = isNaN(startedMs) ? "—" : fmtElapsed(Math.floor((nowMs - startedMs) / 1000));
}

// setConnState renders the header's honest connection state (streaming /
// reconnecting / disconnected — never a bare "connected", per the plan) into
// a role="status" aria-live="polite" element so the transition is announced
// without a manual screen-reader poll of the header.
function setConnState(kind) {
  connEl.className = "conn " + kind;
  connText.textContent = kind === "streaming" ? "streaming" : kind === "reconnecting" ? "reconnecting…" : "disconnected";
}

/* ---------- board rendering: keyed per-row reconciliation ----------
   Rows are keyed by session id and patched in place — a row's DOM subtree is
   only rewritten when its boardModel signature changes, and its position is
   only touched when it is actually out of place (append-in-sorted-order is a
   no-op DOM move when a row is already where it belongs). A row element is
   created or destroyed only when the session SET changes (new/gone id); the
   1s ticker and every SSE event otherwise reuse the same nodes. Mirrors
   tools/hub/index.html's renderFleet keyed-card pattern. */

function buildRowEl() {
  var a = document.createElement("a");
  a.className = "session";
  var pulse = document.createElement("span"); pulse.className = "pulse";
  var phase = document.createElement("span"); phase.className = "phase";
  var content = document.createElement("span"); content.className = "content";
  var sid = document.createElement("span"); sid.className = "sid";
  var detail = document.createElement("span"); detail.className = "detail";
  var extra = document.createElement("span"); extra.className = "extra";
  content.append(sid, detail, extra);
  var elapsed = document.createElement("span"); elapsed.className = "elapsed";
  var line2 = document.createElement("span"); line2.className = "line-2";
  a.append(pulse, phase, content, elapsed, line2);
  a._refs = { phase: phase, sid: sid, detail: detail, extra: extra, elapsed: elapsed, line2: line2 };
  return a;
}

function updateRowEl(a, row) {
  a.className = "session " + row.cssClass;
  // Forward-looking: the detail view's own live wiring lands in the next
  // step, but a stable, bookmarkable href (this app's route codec) costs
  // nothing to wire now and keeps the row a real, keyboard-focusable link
  // rather than a div with a click handler (better-accessibility: native
  // elements first).
  a.href = route({ base: state.base, sessionId: row.id });
  var r = a._refs;
  r.phase.textContent = row.phase;
  r.sid.textContent = row.sid;
  r.sid.title = row.sid;
  if (row.detail) {
    r.detail.hidden = false;
    r.detail.textContent = row.detail;
    r.detail.style.color = row.detailCritical ? "var(--critical)" : "";
  } else {
    r.detail.hidden = true;
    r.detail.textContent = "";
  }
  if (row.extra) { r.extra.hidden = false; r.extra.textContent = row.extra; }
  else { r.extra.hidden = true; r.extra.textContent = ""; }
  r.elapsed.textContent = row.elapsed.text;
  r.line2.textContent = "";
  if (row.line2 && row.line2.kind === "goal") {
    r.line2.hidden = false;
    var g = document.createElement("span");
    g.className = "goal" + (row.line2.live ? " live-goal" : "");
    g.textContent = row.line2.text;
    r.line2.append(g);
  } else if (row.line2) {
    r.line2.hidden = false;
    r.line2.textContent = row.line2.text;
  } else {
    r.line2.hidden = true;
  }
}

function rowSignature(row) {
  return JSON.stringify([
    row.cssClass, row.phase, row.detail, row.detailCritical, row.extra, row.elapsed.text,
    row.line2 ? row.line2.kind : null, row.line2 ? row.line2.text : null, row.line2 ? row.line2.live : null,
  ]);
}

function syncBoard(nowMs) {
  var rows = boardModel(Array.from(state.sessions.values()), state.activities, nowMs);

  if (!rows.length) {
    boardDom.rows.forEach(function (entry) { entry.el.remove(); });
    boardDom.rows.clear();
    if (boardDom.gapEl) { boardDom.gapEl.remove(); boardDom.gapEl = null; }
    if (!boardDom.emptyEl) {
      boardDom.emptyEl = document.createElement("div");
      boardDom.emptyEl.className = "board-empty";
      boardDom.emptyEl.textContent = "no sessions yet";
      sessionsEl.append(boardDom.emptyEl);
    }
    return;
  }
  if (boardDom.emptyEl) { boardDom.emptyEl.remove(); boardDom.emptyEl = null; }

  var seen = new Set();
  var prevEl = null;
  var gapPlaced = false;
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i];
    seen.add(row.id);
    var entry = boardDom.rows.get(row.id);
    if (!entry) {
      entry = { el: buildRowEl(), sig: null };
      boardDom.rows.set(row.id, entry);
    }
    var sig = rowSignature(row);
    if (entry.sig !== sig) { updateRowEl(entry.el, row); entry.sig = sig; }

    if (row.cssClass === "idle" && !gapPlaced && i > 0 && rows[i - 1].cssClass !== "idle") {
      gapPlaced = true;
      if (!boardDom.gapEl) {
        boardDom.gapEl = document.createElement("div");
        boardDom.gapEl.className = "group-gap";
        boardDom.gapEl.setAttribute("role", "presentation");
      }
      if (prevEl) { if (prevEl.nextSibling !== boardDom.gapEl) sessionsEl.insertBefore(boardDom.gapEl, prevEl.nextSibling); }
      else if (sessionsEl.firstChild !== boardDom.gapEl) sessionsEl.insertBefore(boardDom.gapEl, sessionsEl.firstChild);
      prevEl = boardDom.gapEl;
    }

    if (prevEl) { if (prevEl.nextSibling !== entry.el) sessionsEl.insertBefore(entry.el, prevEl.nextSibling); }
    else if (sessionsEl.firstChild !== entry.el) sessionsEl.insertBefore(entry.el, sessionsEl.firstChild);
    prevEl = entry.el;
  }
  if (boardDom.gapEl && !gapPlaced) { boardDom.gapEl.remove(); boardDom.gapEl = null; }
  boardDom.rows.forEach(function (entry, id) {
    if (!seen.has(id)) { entry.el.remove(); boardDom.rows.delete(id); }
  });
}

/* ---------- live event handling ---------- */

function handleEvent(ev) {
  if (!ev || typeof ev.type !== "string") return;
  if (typeof ev.seq === "number" && ev.seq > state.lastSeq) state.lastSeq = ev.seq;
  var sid = ev.session_id;
  if (!sid) return;
  if (ev.type === "session.created" && !state.sessions.has(sid)) {
    // A minimal stub so the new row appears immediately; the next poll (at
    // most POLL_MS later) fills in workdir/goal/queued/etc — see the plan's
    // "5s poll refreshes composite/queue/goal fields the stream doesn't
    // carry".
    state.sessions.set(sid, {
      id: sid, state: "idle", status: "idle", queued: 0, goal: null,
      last_activity_at: new Date().toISOString(),
    });
  }
  var prev = state.activities.get(sid);
  if (!prev && state.sessions.has(sid)) prev = seedActivity(state.sessions.get(sid));
  state.activities.set(sid, reduceActivity(prev, ev, Date.now()));
  syncBoard(Date.now());
  // The board and an open detail view are both fed from this SAME stream
  // (the plan's "single stream carries ALL sessions' events" — the detail
  // view filters by session id, never a second connection).
  if (detailState && sid === detailState.sessionId) handleDetailEvent(ev);
}

/* ---------- poll: health identity is fetched once at connect (started_at
   never changes for a process's lifetime); GET /session refreshes composite
   state/queue/goal every POLL_MS. ---------- */

function pollOnce() {
  return api("GET", "/session").then(function (resp) {
    if (resp.status === 401) { forceDisconnect("run token was rejected — reconnect"); return; }
    if (!resp.ok) return; // transient; the next poll or the stream will refill
    return resp.json().then(function (list) {
      if (!state.running) return;
      state.sessions = new Map(list.map(function (s) { return [s.id, s]; }));
      state.activities.forEach(function (_v, id) { if (!state.sessions.has(id)) state.activities.delete(id); });
      var hw = maxSeq(list);
      if (hw > state.lastSeq) state.lastSeq = hw;
      syncBoard(Date.now());
      // The primary self-heal trigger (maybeSelfHealDetail, TESTABLE
      // predicate detailUnderpopulated) — every POLL_MS, unconditionally,
      // while a detail view is open: whatever silently stalled its
      // initial/reconciled history load self-corrects within one poll
      // interval, independent of the stream ever (re)opening.
      maybeSelfHealDetail();
    });
  }).catch(function () { /* transient; the next poll or the stream will refill */ });
}

/* ---------- SSE stream: resumes from state.lastSeq, jittered-backoff
   reconnect. Never EventSource (can't set the Authorization header) — a
   hand-rolled fetch-stream reader, same as hub/inspector. ---------- */

function connectStream() {
  if (!state.running) return;
  var ac = new AbortController();
  state.abort = ac;
  fetch(state.base + "/event?from=" + state.lastSeq, {
    headers: { Authorization: "Bearer " + state.token }, signal: ac.signal,
  }).then(function (resp) {
    if (!resp.ok || !resp.body) throw new Error("event stream " + resp.status);
    state.backoff = BACKOFF_MIN;
    setConnState("streaming");
    // reconcileDetail's finding-1 trigger, now firing on EVERY successful
    // stream open, not only a genuine RE-establish after a reconnect — see
    // the deep-link-history race this closes ("deep-linked detail view
    // reliably loads history after connect").
    //
    // The ORIGINAL reasoning here (still correct as far as it went) was:
    // only a re-establish can have missed EVENTS, because the very first
    // stream open has nothing behind it to have missed, and enterDetail's
    // own history fetch (if a detail view raced ahead of connect via a
    // deep link — applyRoute() runs synchronously right after THIS
    // function is invoked, in attemptConnect, so enterDetail's fetch is
    // always ISSUED with an already-correct state.base/state.token) is
    // already fresh AS OF THE MOMENT IT WAS ISSUED. That data-freshness
    // argument is still true. What it missed: freshness-as-issued is not
    // the same as guaranteed delivery. enterDetail's initial fetch is a
    // single, un-retried GET with no fallback — confirmed live, it can
    // silently fail to land (a transient response hiccup on that one
    // request while /health, /session and this very stream all succeed)
    // and nothing ever retries it, leaving the transcript stuck on "no
    // messages yet" until the operator navigates again. Re-running
    // reconcileDetail() here — cheap, idempotent, already guarded by
    // detailState.loadToken (a superseded/navigated-away session's result
    // is discarded, never clobbers the current view) and
    // detailState.reconciling (no overlapping fetches) — costs one extra
    // GET /session/{id}/message on every fresh connect that happens to
    // have a detail view already open (the deep-link case), and turns
    // enterDetail's fetch from a single point of failure into a race this
    // page always wins: whichever of the two GETs lands, the transcript
    // renders. A stream that never reaches "streaming" at all (the box is
    // genuinely down) leaves forceDisconnect's own exitDetail() to drop
    // back to the board, same as before this change.
    if (detailState) reconcileDetail();
    var reader = resp.body.getReader();
    var dec = new TextDecoder();
    var parse = createSSEParser(function (frame) {
      var ev;
      try { ev = JSON.parse(frame.data); } catch (e) { return; }
      handleEvent(ev);
    });
    function pump() {
      return reader.read().then(function (r) {
        if (r.done) return;
        parse(dec.decode(r.value, { stream: true }));
        return pump();
      });
    }
    return pump();
  }).catch(function () { /* fall through to reconnect below unless deliberately stopped */ })
    .then(function () {
      if (!state.running) return;
      scheduleReconnect();
    });
}

// scheduleReconnect backs off 500ms -> 1s -> 2s ... capped at 10s, jittered
// to 50-100% of that delay each attempt so a reconnect never lands on an
// exact, predictable cadence.
function scheduleReconnect() {
  setConnState("reconnecting");
  var jitter = 0.5 + Math.random() * 0.5;
  var delay = Math.round(state.backoff * jitter);
  state.backoff = Math.min(state.backoff * 2, BACKOFF_MAX);
  clearTimeout(state.streamTimer);
  state.streamTimer = setTimeout(function () { if (state.running) connectStream(); }, delay);
}

/* ---------- 1s ticker: elapsed/staleness text + classes only, via the same
   keyed syncBoard patch path (a no-op DOM write for any row whose signature
   didn't change this tick). ---------- */

function tick() {
  renderUptime(Date.now());
  syncBoard(Date.now());
  if (detailState) renderDetail();
}

/* ---------- detail view: history fetch + live tail + tool folds +
   composer, all against the SAME connect/stream/poll lifecycle above (no
   second connection — the plan's "single stream carries ALL sessions'
   events"; this view just filters handleEvent's dispatch by session id, see
   handleEvent's tail call into handleDetailEvent).

   DOM reconciliation mirrors the board's keyed-row pattern (buildRowEl/
   updateRowEl/rowSignature/syncBoard): each transcriptModel entry gets a
   stable key (entryKey, TESTABLE), an element is created once per key and
   patched in place on every subsequent render whose signature changed —
   the durable prefix of a long transcript is touched exactly once; only
   the live tail (streaming text, a running tool fold's ticking elapsed) is
   ever re-patched on a delta or a 1s tick. ---------- */

var transcriptEl = document.getElementById("transcript");

// toolElapsedText renders a tool fold's elapsed time from LOCALLY observed
// timestamps only (detailState.toolStartedAt/toolEndedAt, populated by
// handleDetailEvent as tool.start/tool.end/tool-result events are actually
// seen on this page) — never fabricated. A fold resolved entirely from the
// initial history fetch (already running, or already finished, before this
// page ever watched it) carries no local timing at all and renders no
// number, same spirit as seedActivity's null startedAt on the board.
function toolElapsedText(entry, nowMs) {
  if (!detailState) return "";
  var start = detailState.toolStartedAt.get(entry.id);
  if (start == null) return "";
  var end = entry.running ? nowMs : (detailState.toolEndedAt.get(entry.id) || nowMs);
  return fmtElapsed(Math.max(0, Math.round((end - start) / 1000)));
}

function entrySignature(entry, isCurrentTurn, nowMs) {
  switch (entry.kind) {
    case "turn-mark":
      // Keys on the RENDERED ago-text (mirroring boardModel's own
      // elapsed.text-in-the-signature approach for idle rows), not
      // entry.at itself: entry.at is immutable once a turn settles, so
      // keying on it alone meant a settled turn-mark's "· Xm ago" froze at
      // whatever it first rendered — syncTranscript's signature-gated patch
      // (see its own doc comment) never saw a reason to re-touch the node
      // on a later tick. Cheaper than special-casing turn-marks as an
      // always-repatch exception, and consistent with how every other
      // ticking display in this file (toolElapsedText, boardModel's own
      // elapsed) is kept fresh.
      return "turn|" + entry.turn + "|" + (isCurrentTurn ? "current" : turnMarkAgoText(entry, nowMs));
    case "tool":
      return "tool|" + entry.running + "|" + entry.output + "|" + entry.isError + "|" + toolElapsedText(entry, nowMs);
    default:
      return entry.kind + "|" + (entry.text || "") + "|" + !!entry.streaming;
  }
}

function buildTurnMarkEl() {
  var d = document.createElement("div");
  d.className = "turn-mark";
  return d;
}
function updateTurnMarkEl(el, entry, isCurrentTurn, nowMs) {
  if (isCurrentTurn) { el.textContent = "current turn"; return; }
  var label = "turn " + entry.turn;
  var ago = turnMarkAgoText(entry, nowMs);
  if (ago) label += " · " + ago;
  el.textContent = label;
}

function buildMsgEl(kind) {
  var d = document.createElement("div");
  d.className = "msg" + (kind === "operator" ? " user" : kind === "reasoning" ? " reasoning" : kind === "error" ? " error" : "");
  var who = document.createElement("span");
  who.className = "who";
  who.textContent = kind === "operator" ? "operator" : kind;
  var body = document.createElement("div");
  body.className = "body";
  var p = document.createElement("p");
  body.append(p);
  d.append(who, body);
  d._refs = { p: p, caret: null };
  return d;
}
function updateMsgEl(el, entry) {
  var r = el._refs;
  r.p.textContent = entry.text || "";
  var wantCaret = !!entry.streaming;
  if (wantCaret && !r.caret) {
    r.caret = document.createElement("span");
    r.caret.className = "caret";
    r.p.append(r.caret);
  } else if (!wantCaret && r.caret) {
    r.caret.remove();
    r.caret = null;
  }
}

function buildToolEl() {
  var d = document.createElement("div");
  d.className = "msg";
  var who = document.createElement("span");
  who.className = "who";
  who.textContent = "tool";
  var body = document.createElement("div");
  body.className = "body";
  var details = document.createElement("details");
  details.className = "toolfold";
  var summary = document.createElement("summary");
  var ts = document.createElement("div");
  ts.className = "tool-summary";
  var cmdEl = document.createElement("span");
  var hint = document.createElement("span");
  hint.className = "fold-hint";
  hint.textContent = "show output";
  var elapsedEl = document.createElement("span");
  elapsedEl.className = "t-elapsed";
  ts.append(cmdEl, hint, elapsedEl);
  summary.append(ts);
  var block = document.createElement("div");
  block.className = "toolblock";
  details.append(summary, block);
  body.append(details);
  d.append(who, body);
  d._refs = { details: details, cmdEl: cmdEl, elapsedEl: elapsedEl, block: block };
  return d;
}
function updateToolEl(el, entry, elapsedText) {
  var r = el._refs;
  r.cmdEl.textContent = toolLabel(entry.name, entry.argsSummary);
  r.cmdEl.className = entry.running ? "cmd" : "";
  r.elapsedEl.textContent = entry.running ? ("running" + (elapsedText ? " · " + elapsedText : "")) : elapsedText;
  var out = entry.output || (entry.running ? "" : (entry.isError ? "(error, no output)" : "(no output)"));
  r.block.textContent = out;
  r.block.style.color = entry.isError ? "var(--critical)" : "";
}

// buildTurnEmptyEl/updateTurnEmptyEl render the "turn completed with no
// output" placeholder (transcriptModel's "turn-empty" kind) by reusing the
// SAME .transcript-note class the empty-transcript/history-load-error notes
// already use elsewhere in this file — already dim (var(--text-3)) and
// unobtrusive, i.e. exactly the "turn-mark register, not error" the entry
// calls for, with no new CSS needed.
function buildTurnEmptyEl() {
  var d = document.createElement("div");
  d.className = "transcript-note";
  return d;
}
function updateTurnEmptyEl(el, entry) {
  el.textContent = entry.text || "";
}

// buildPendingEl/updatePendingEl render the "Thinking…" pending-assistant
// indicator (transcriptModel's "pending" kind — see its own doc comment for
// the derivation rule). Static content: nothing about it ever changes while
// it exists (entrySignature's default case — entry.kind + text + streaming
// — is constant for a bare {kind:"pending"} entry with no text field), so
// updatePendingEl is a no-op; syncTranscript's signature gate means it is
// built exactly once and then only removed (once real content dismisses it)
// or repositioned, never re-touched on a tick, matching entryKey's own
// "one node, never rebuilt" comment for this kind.
function buildPendingEl() {
  var d = document.createElement("div");
  d.className = "transcript-note pending-indicator";
  d.textContent = "Thinking";
  var dots = document.createElement("span");
  dots.setAttribute("aria-hidden", "true");
  dots.textContent = "…";
  d.append(dots);
  return d;
}
function updatePendingEl() { /* static — nothing to patch */ }

function buildEntryEl(entry) {
  if (entry.kind === "turn-mark") return buildTurnMarkEl();
  if (entry.kind === "tool") return buildToolEl();
  if (entry.kind === "turn-empty") return buildTurnEmptyEl();
  if (entry.kind === "pending") return buildPendingEl();
  return buildMsgEl(entry.kind);
}
function updateEntryEl(el, entry, isCurrentTurn, nowMs) {
  if (entry.kind === "turn-mark") return updateTurnMarkEl(el, entry, isCurrentTurn, nowMs);
  if (entry.kind === "tool") return updateToolEl(el, entry, toolElapsedText(entry, nowMs));
  if (entry.kind === "turn-empty") return updateTurnEmptyEl(el, entry);
  if (entry.kind === "pending") return updatePendingEl();
  return updateMsgEl(el, entry);
}

function showTranscriptError(msg) {
  transcriptEl.textContent = "";
  var d = document.createElement("div");
  d.className = "transcript-note err";
  d.textContent = msg;
  transcriptEl.append(d);
  if (detailState) { detailState.nodes = new Map(); detailState.order = []; }
}

// syncTranscript reconciles `entries` (transcriptModel's full current
// output) against the DOM by key (entryKey): existing nodes are patched in
// place (only when their signature actually changed) and repositioned only
// if out of order; nodes for keys no longer present are removed. The last
// turn-mark is labeled "current turn" instead of a timestamp only while the
// session's own activity fold (the SAME one the board uses) says it isn't
// idle — so a turn that finished stops claiming to be current the next
// time any event for this session ticks a render.
function syncTranscript(entries, nowMs) {
  if (!detailState) return;
  if (!entries.length) {
    transcriptEl.textContent = "";
    detailState.nodes = new Map();
    detailState.order = [];
    var empty = document.createElement("div");
    empty.className = "transcript-note";
    empty.textContent = "no messages yet";
    transcriptEl.append(empty);
    return;
  }
  if (!detailState.nodes.size) transcriptEl.textContent = ""; // clear "no messages yet"/error note, if present

  var lastTurnMarkIdx = -1;
  for (var ti = 0; ti < entries.length; ti++) if (entries[ti].kind === "turn-mark") lastTurnMarkIdx = ti;
  var activity = state.activities.get(detailState.sessionId);
  var sessionLive = !!activity && activity.phase !== "idle";

  var seen = new Set();
  var prevEl = null;
  for (var idx = 0; idx < entries.length; idx++) {
    var entry = entries[idx];
    var key = entryKey(entry, idx);
    seen.add(key);
    var isCurrentTurn = idx === lastTurnMarkIdx && sessionLive;
    var node = detailState.nodes.get(key);
    var isNew = !node;
    if (isNew) {
      node = buildEntryEl(entry);
      detailState.nodes.set(key, node);
    }
    var sig = entrySignature(entry, isCurrentTurn, nowMs);
    if (isNew || node._sig !== sig) {
      updateEntryEl(node, entry, isCurrentTurn, nowMs);
      node._sig = sig;
      // A running tool fold starts open (so the operator watching it land
      // sees output as it arrives); a completed fold discovered directly
      // from history starts collapsed. Set only on creation — never forced
      // open/closed again afterward, so a manual toggle is never overridden
      // by a later, unrelated patch (better-accessibility: respect the
      // user's own <details> state).
      if (isNew && entry.kind === "tool") node._refs.details.open = entry.running;
    }
    if (prevEl) { if (prevEl.nextSibling !== node) transcriptEl.insertBefore(node, prevEl.nextSibling); }
    else if (transcriptEl.firstChild !== node) transcriptEl.insertBefore(node, transcriptEl.firstChild);
    prevEl = node;
  }
  detailState.nodes.forEach(function (node, key) {
    if (!seen.has(key)) { node.remove(); detailState.nodes.delete(key); }
  });
}

function updateShowEarlier(win) {
  if (!detailState) return;
  if (win.hiddenCount > 0 && !detailState.expanded) {
    if (!detailState.showEarlierEl) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "show-earlier";
      b.addEventListener("click", function () {
        if (!detailState) return;
        detailState.expanded = true;
        renderDetail();
      });
      detailState.showEarlierEl = b;
    }
    detailState.showEarlierEl.textContent = "Show " + win.hiddenCount + " earlier message" + (win.hiddenCount === 1 ? "" : "s");
    if (transcriptEl.firstChild !== detailState.showEarlierEl) transcriptEl.insertBefore(detailState.showEarlierEl, transcriptEl.firstChild);
  } else if (detailState.showEarlierEl && detailState.showEarlierEl.parentNode) {
    detailState.showEarlierEl.remove();
  }
}

function updateDetailHeader(entries, nowMs) {
  var sid = detailState.sessionId;
  var msgs = detailState.messages.length + liveMessageCount(detailState.liveEvents);
  document.getElementById("detail-msgcount").textContent = msgs + (msgs === 1 ? " msg" : " msgs");
  var toolCalls = countKind(entries, "tool");
  document.getElementById("detail-toolcount").textContent = toolCalls + (toolCalls === 1 ? " tool call" : " tool calls");

  // Reuse boardModel for this one session so the header's phase/elapsed/
  // live-ness is drawn from the exact same activity fold the board shows —
  // "live chip mirroring board phase" by construction, not a second,
  // possibly-divergent read of the same state.
  var sessionSummary = state.sessions.get(sid) || { id: sid, state: "idle", queued: 0 };
  var row = boardModel([sessionSummary], state.activities, nowMs)[0];
  var turnEl = document.getElementById("detail-turn-elapsed");
  var chip = document.getElementById("detail-livechip");
  var chipText = document.getElementById("detail-livechip-text");
  if (row && row.cssClass !== "idle") {
    turnEl.textContent = row.elapsed.text;
    chip.hidden = false;
    chipText.textContent = row.phase === "tool" ? "tool running" : row.phase;
  } else {
    turnEl.textContent = "—";
    chip.hidden = true;
    // Belt-and-suspenders, matching updateRowEl's own r.detail.textContent =
    // "" on the board: never rely on `hidden` alone to keep stale content
    // from being visible (see the .livechip:not([hidden]) CSS comment above
    // for why `hidden` alone was, in fact, not enough).
    chipText.textContent = "";
  }
}

// renderDetail is the detail view's whole render pass: pure model recompute
// (historyWindow + transcriptModel, both cheap/pure — same cost profile as
// the board's own boardModel-per-tick) followed by keyed DOM reconciliation
// (syncTranscript), which is where "no full re-render per delta" actually
// pays off — most calls here touch zero or one DOM node.
function renderDetail() {
  if (!detailState) return;
  var now = Date.now();
  var win = historyWindow(detailState.messages, detailState.expanded ? null : HISTORY_WINDOW);
  var entries = transcriptModel(win.window, detailState.liveEvents, win.hiddenTurns, detailState.pendingSends);
  syncTranscript(entries, now);
  updateShowEarlier(win);
  updateDetailHeader(entries, now);
}

// handleDetailEvent is handleEvent's per-session forward for whichever
// session the detail view currently has open: it records local tool
// start/end timestamps for honest elapsed rendering (see toolElapsedText),
// appends the raw event to the live buffer transcriptModel folds, and
// re-renders. Triggers reconcileDetail() once liveEvents crosses
// DETAIL_LIVE_EVENTS_CAP — the perf half of reconcileDetail's job (see its
// doc comment); the reconnect half is triggered separately, from
// connectStream, on stream re-establish.
function handleDetailEvent(ev) {
  if (!detailState) return;
  var now = Date.now();
  if (ev.type === "tool.start" && ev.tool_call && ev.tool_call.call_id) {
    detailState.toolStartedAt.set(ev.tool_call.call_id, now);
  } else if (ev.type === "tool.end" && ev.tool_call && ev.tool_call.call_id) {
    detailState.toolEndedAt.set(ev.tool_call.call_id, now);
  } else if (ev.type === "message" && ev.message && ev.message.role === "tool" && Array.isArray(ev.message.parts)) {
    for (var i = 0; i < ev.message.parts.length; i++) {
      var p = ev.message.parts[i];
      if (p && p.type === "tool_result" && p.call_id && !detailState.toolEndedAt.has(p.call_id)) {
        detailState.toolEndedAt.set(p.call_id, now);
      }
    }
  }
  detailState.liveEvents.push(ev);
  // Tracked synchronously, before reconcileDetail's async trim can ever
  // run — see __monitorDebug.liveEventsPeakLength's own comment for why a
  // test can't reliably observe a transient over-cap spike any other way
  // for a fast turn.
  if (detailState.liveEvents.length > detailState.peakLiveEventsLength) detailState.peakLiveEventsLength = detailState.liveEvents.length;
  if (detailState.liveEvents.length > DETAIL_LIVE_EVENTS_CAP) reconcileDetail();
  renderDetail();
}

// reconcileDetail re-anchors the detail view's live tail against a fresh
// durable snapshot, closing three independent gaps with the SAME mechanism:
//
//   1. RECONNECT GAP (finding 1): pollOnce silently advances state.lastSeq
//      past whatever a poll snapshot's own maxSeq reports, REGARDLESS of
//      whether this page's own SSE connection actually delivered every
//      event up to that point — a durable event published while this
//      page's stream was down (jittered backoff — see scheduleReconnect)
//      is one this page never saw, yet the NEXT connectStream() resumes
//      from that already-advanced from=state.lastSeq, so the resumed
//      stream never redelivers it either. The board doesn't notice: every
//      5s poll REPLACES state.sessions wholesale, a full resnapshot, not an
//      incremental delta. The detail view has no equivalent — liveEvents is
//      purely additive — so a gap during a reconnect leaves a permanent
//      hole transcriptModel can never fill from what it's given.
//   2. UNBOUNDED BUFFER (finding 3): liveEvents otherwise grows without
//      bound across a long session's lifetime, and transcriptModel refolds
//      the WHOLE buffer on every tick/delta (see DETAIL_LIVE_EVENTS_CAP).
//   3. DEEP-LINK BOOT RACE: enterDetail's OWN initial history fetch (fired
//      the instant a "#s=<id>" deep link resolves via applyRoute(), right
//      after a fresh connect — see attemptConnect) is a single, un-retried
//      GET with no fallback of its own. Confirmed live: it can silently
//      fail to land while /health, /session, and this very stream all
//      succeed, leaving the transcript stuck on "no messages yet" with no
//      retry. connectStream's "streaming" branch now calls this function
//      on EVERY successful stream open (first included, not only a
//      genuine reconnect) whenever a detail view is already showing,
//      turning enterDetail's fetch from a single point of failure into a
//      race this page always wins — see connectStream's own doc comment
//      for the full reasoning.
//
// The fix for all three: re-fetch GET /session/{id}/message (guarded by
// detailState.loadToken exactly like enterDetail's own initial fetch, so a
// slow response for a session the operator has since navigated away from —
// or into a different session — is discarded, never applied to the wrong
// detailState), replace detailState.messages wholesale, THEN capture
// snapSeq = state.lastSeq (the highest seq this page has observed
// ANYWHERE — board or detail; server/journal.go's Seq is ONE monotonically
// increasing counter across every session on one server, see maxSeq/
// journal.go's emitDurableLocked) and drop every liveEvents entry whose seq
// is <= snapSeq. What's left is exactly what postdates the snapshot — no
// gap, no duplication, by the monotonic-seq guarantee.
//
// snapSeq is read AFTER the fetch resolves, not when it's issued: a stream
// re-establish (this function's OTHER trigger, from connectStream) can
// itself cause the server to replay a small backlog over the SAME newly
// reconnected stream (whenever state.lastSeq was NOT already advanced past
// some durable events — e.g. no poll happened to land during a brief
// outage), concurrently with this fetch. handleEvent bumps state.lastSeq
// for EVERY event BEFORE forwarding it to handleDetailEvent, so any such
// replayed event that this page has already processed by the time the
// fetch resolves has already pushed state.lastSeq past its own seq — this
// function then correctly recognizes it as already reflected in the JUST-
// fetched snapshot and drops it, rather than keeping it (its seq was
// captured-as-"new" under the old, pre-fetch reading) and rendering it
// TWICE — once from the fresh `messages` fold, once from the surviving
// liveEvents entry. Capturing snapSeq first (before the fetch) is what
// caused exactly that double-render in practice. This still leaves one
// narrow, accepted race: an event journaled on the server WHILE the
// GET /message response was already being serialized (so it missed that
// snapshot) but that streams in and gets processed here BEFORE this
// function reads state.lastSeq would be dropped without ever appearing —
// a real gap, but one bounded by a single fast local read's duration, not
// an entire reconnect backoff window.
//
// Which liveEvents entries actually survive the seq boundary — including
// the seq-less-events rule and the session.error/turn.end/session.aborted
// exception (these three have NO GET /message representation at all, so a
// fresh snapshot can never reconstruct one that the boundary dropped; see
// the hard-won lesson in that doc comment) — is keepsLiveEventAfterReconcile
// (TESTABLE region, above)'s own doc comment; not repeated here.
// detailState's own toolStartedAt/toolEndedAt maps (separate from
// liveEvents, keyed by call_id, never touched by this function) keep a
// genuinely still-running tool's LOCALLY OBSERVED elapsed time ticking
// accurately straight through the reconcile regardless of what happens to
// its tool.start/tool.end liveEvents entries.
//
// detailState.reconciling guards against overlapping fetches (e.g. the
// buffer is still over-cap immediately after one reconcile, because every
// surviving event genuinely postdates snapSeq) — the same in-flight-guard
// shape as the composer's own postInFlight.
function reconcileDetail() {
  if (!detailState || detailState.reconciling) return;
  detailState.reconciling = true;
  var sessionId = detailState.sessionId;
  var loadToken = detailState.loadToken;
  api("GET", "/session/" + encodeURIComponent(sessionId) + "/message").then(function (resp) {
    if (!detailState || detailState.loadToken !== loadToken) return; // navigated away meanwhile
    if (!resp.ok) return; // transient; the next trigger (cap or reconnect) retries
    return resp.json().then(function (raw) {
      if (!detailState || detailState.loadToken !== loadToken) return;
      var adapted = adaptHistory(raw);
      detailState.messages = adapted.messages;
      detailState.unavailable = adapted.unavailable;
      // Read AFTER the fetch resolves — see this function's doc comment
      // for why that ordering, not "before the fetch", is what avoids
      // double-rendering a turn the reconnect itself also naturally
      // replayed live.
      var snapSeq = state.lastSeq;
      detailState.liveEvents = detailState.liveEvents.filter(function (ev) {
        return keepsLiveEventAfterReconcile(ev, snapSeq);
      });
      renderDetail();
    });
  }).catch(function () { /* transient; the next trigger (cap or reconnect) retries */ })
    .then(function () {
      if (detailState && detailState.loadToken === loadToken) detailState.reconciling = false;
    });
}

// maybeSelfHealDetail applies detailUnderpopulated (TESTABLE, above) against
// LIVE state: the currently-open detail view's rendered durable message
// count vs. its session's own board summary (state.sessions — already kept
// current by pollOnce, and by attemptConnect's own initial GET /session
// before enterDetail/applyRoute ever run). Triggers reconcileDetail() on a
// true verdict — cheap and safe to call speculatively: reconcileDetail's own
// detailState.reconciling guard drops an overlapping call, and its loadToken
// guard drops a result for a session the operator has since left. Called
// from two places:
//   - pollOnce, every POLL_MS, unconditionally while a detail view is open —
//     the primary self-heal: whatever silently stalled enterDetail's own
//     initial fetch (network hiccup, dropped response, anything — this
//     deliberately does not depend on diagnosing WHY), the view heals
//     within one poll interval, not "whenever the stream happens to open"
//     (connectStream's own reconcile trigger can be seconds away on a slow
//     box, and does not fire at all until the stream successfully opens).
//   - enterDetail's own fetch-resolved callback, checking IMMEDIATELY
//     against the summary connect already fetched — closing the stuck-empty
//     window well inside a single poll interval for the common case where
//     the initial fetch resolves fast but empty/wrong, rather than making
//     every deep link wait out a full POLL_MS regardless.
function maybeSelfHealDetail() {
  if (!detailState) return;
  var summary = state.sessions.get(detailState.sessionId);
  if (!summary) return;
  if (detailUnderpopulated(summary.messages, detailState.messages.length)) reconcileDetail();
}

// enterDetail switches to the detail view for `sessionId` and fetches its
// durable history. Focus moves to the breadcrumb immediately (a screen
// reader/keyboard user lands at the top of the new view the moment
// navigation happens, not after the network round trip) — see
// better-accessibility's focus-management pass in the plan.
//
// This fetch is no longer the ONLY thing that can load this view's
// history: connectStream's "streaming" branch also calls reconcileDetail()
// on every successful stream open while a detail view is showing (see its
// own doc comment and reconcileDetail's "DEEP-LINK BOOT RACE" finding),
// and pollOnce/this function's own fetch-resolved callback both call
// maybeSelfHealDetail() (see its doc comment) — a deep link resolved via
// applyRoute() right after a fresh connect (this call) races that same
// connect's own stream open AND is checked against the board summary
// immediately and every POLL_MS after. Any of these landing is enough to
// populate the transcript; all are guarded by the SAME loadToken, so
// whichever resolves is safe to apply regardless of order.
function enterDetail(sessionId) {
  var loadToken = ++detailLoadCounter;
  detailState = {
    sessionId: sessionId, messages: [], unavailable: 0, liveEvents: [], expanded: false,
    nodes: new Map(), showEarlierEl: null,
    toolStartedAt: new Map(), toolEndedAt: new Map(),
    postInFlight: false, loadToken: loadToken, reconciling: false, peakLiveEventsLength: 0,
    // pendingSends: the composer's optimistic-send state (see wireComposer
    // and transcriptModel's own doc comment) — {text, clientId} entries
    // appended on submit, removed only on an explicit POST-failure rollback.
    // A fresh, empty array per enterDetail — never carried over between
    // sessions, same as every other detailState field.
    pendingSends: [],
  };
  document.body.classList.add("showing-detail");
  document.getElementById("detail-sid-full").textContent = sessionId;
  document.getElementById("crumb-box").textContent = " / " + (hostLabel(state.base) || "—");
  document.getElementById("back-link").href = route({ base: state.base });
  document.getElementById("composer-err").textContent = "";
  document.getElementById("composer-input").value = "";
  transcriptEl.textContent = "";
  var loading = document.createElement("div");
  loading.className = "transcript-note";
  loading.textContent = "loading history…";
  transcriptEl.append(loading);
  document.getElementById("detail-msgcount").textContent = "";
  document.getElementById("detail-toolcount").textContent = "";
  document.getElementById("detail-turn-elapsed").textContent = "—";
  document.getElementById("detail-livechip").hidden = true;
  document.getElementById("back-link").focus();

  api("GET", "/session/" + encodeURIComponent(sessionId) + "/message").then(function (resp) {
    if (!detailState || detailState.loadToken !== loadToken) return; // navigated away meanwhile
    if (!resp.ok) { showTranscriptError("failed to load history (status " + resp.status + ")"); maybeSelfHealDetail(); return; }
    return resp.json().then(function (raw) {
      if (!detailState || detailState.loadToken !== loadToken) return;
      var adapted = adaptHistory(raw);
      detailState.messages = adapted.messages;
      detailState.unavailable = adapted.unavailable;
      renderDetail();
      if (adapted.unavailable > 0) {
        var note = document.createElement("div");
        note.className = "transcript-note";
        note.textContent = adapted.unavailable + " message" + (adapted.unavailable === 1 ? "" : "s") + " could not be rendered";
        transcriptEl.append(note);
      }
      // Checked here too, not only on the next poll: this fetch may have
      // resolved 200-OK but genuinely empty (or truncated) despite the
      // session's own board summary — already known from connect's own
      // GET /session — reporting real durable messages. See
      // maybeSelfHealDetail's own doc comment for why this is safe to
      // call unconditionally (a no-op unless the stuck-empty case is
      // detected).
      maybeSelfHealDetail();
    });
  }).catch(function () {
    if (detailState && detailState.loadToken === loadToken) showTranscriptError("failed to load history — check the connection");
    maybeSelfHealDetail();
  });
}

// exitDetail returns to the board, moving focus to the row that opened this
// session if it still exists (better-accessibility: focus return on back
// navigation), else to the session list itself.
function exitDetail() {
  if (!detailState) return;
  var sid = detailState.sessionId;
  detailState = null;
  document.body.classList.remove("showing-detail");
  var rowEntry = boardDom.rows.get(sid);
  if (rowEntry) {
    rowEntry.el.focus();
  } else {
    sessionsEl.setAttribute("tabindex", "-1");
    sessionsEl.focus();
  }
}

// applyRoute reads the URL fragment and enters/exits the detail view to
// match it — the sole navigation path (hashchange-driven, house style):
// clicking a board row, the back link, browser back/forward, and a direct
// "#b=...&s=..." deep link all funnel through the SAME hash and this SAME
// function, called after every hashchange and once more right after a
// successful connect (a deep link's session id can arrive before this page
// is even connected to fetch it).
function applyRoute() {
  var r = unroute(location.hash);
  if (r.sessionId && state.running) {
    if (!detailState || detailState.sessionId !== r.sessionId) enterDetail(r.sessionId);
  } else if (!r.sessionId && detailState) {
    exitDetail();
  }
}
window.addEventListener("hashchange", applyRoute);

// bfcache restore (browser back/forward reviving this exact page instance
// rather than re-running its scripts — event.persisted true): the
// underlying SSE stream connection is presumed dead (suspended/discarded
// by the browser while this page was frozen), even though state.running
// and the header's "connected"/"streaming" styling still reflect
// whatever they were the instant the page was frozen, not reality. Only
// acts if this page was actually connected when frozen (state.running) —
// nothing to resync for a frozen connect panel. Two independent, reused
// mechanisms, no new reconnect logic of its own:
//   - abort the (presumed-dead) stream: connectStream's OWN existing
//     catch -> scheduleReconnect path re-establishes it with the SAME
//     jittered backoff any other network failure gets, rather than this
//     page silently never noticing the stream is gone.
//   - pollOnce() immediately, rather than waiting out however much of the
//     current POLL_MS interval happened to be left when the page froze —
//     refreshes state.sessions and, via maybeSelfHealDetail (see its own
//     doc comment), re-syncs an open detail view against the board
//     summary right away.
window.addEventListener("pageshow", function (e) {
  if (!e.persisted || !state.running) return;
  if (state.abort) state.abort.abort();
  pollOnce();
});

/* ---------- composer: POST prompt_async. The sent message renders
   IMMEDIATELY on submit — a pendingSend pushed into detailState.pendingSends
   and folded by transcriptModel as a trailing optimistic operator entry (see
   its own doc comment) — independent of the POST resolving, so there is no
   perceived network-hop lag for the common idle-session case. It is
   reconciled away (dropped, not duplicated) the instant a real durable/
   stream operator message arrives: a "message" event when the session was
   idle and the turn starts immediately, or a "prompt.queued" event when it
   was busy. A non-2xx response or a network failure instead ROLLS BACK the
   optimistic entry (removePendingSend) — it was never real — leaving the
   existing inline composer error to explain why. The input is disabled ONLY
   for the duration of the POST itself — queueing a prompt into a busy
   session is a feature, not a wait state. See also the "Thinking…" pending
   entry (transcriptModel's "pending" kind): a DIFFERENT, non-optimistic
   mechanism — it reflects a real running turn, derived purely from the
   fold, never from this composer's own submit path. ---------- */

// nextPendingSendId hands out a small, monotonic, page-local id for a
// pendingSend's clientId (see transcriptModel's own doc comment and
// entryKey's "pendingSend:" case) — never sent over the wire, so it only
// needs to be unique within this one page's lifetime, not globally.
var pendingSendCounter = 0;
function nextPendingSendId() {
  pendingSendCounter += 1;
  return "psend-" + pendingSendCounter;
}

// removePendingSend rolls back a pendingSend by clientId — used ONLY on a
// failed POST (the send never actually happened), never on success (a
// successful POST's pendingSend is left in place; the eventual stream event
// reconciles it out via transcriptModel's own fold — see its doc comment).
function removePendingSend(ds, clientId) {
  if (!ds) return;
  ds.pendingSends = ds.pendingSends.filter(function (p) { return p.clientId !== clientId; });
}

function setComposerBusy(busy) {
  document.getElementById("composer-input").disabled = busy;
  document.getElementById("composer-form").querySelector("button").disabled = busy;
}

function wireComposer() {
  var form = document.getElementById("composer-form");
  var input = document.getElementById("composer-input");
  var err = document.getElementById("composer-err");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!detailState || detailState.postInFlight) return;
    var text = input.value.trim();
    if (!text) return;
    err.textContent = "";
    detailState.postInFlight = true;
    setComposerBusy(true);
    var sid = detailState.sessionId;
    // Captured so this POST's eventual completion can never mutate a LATER
    // session's detailState/composer DOM: the composer's input/err/button
    // elements are singletons reused across every session's detail view
    // (never recreated per enterDetail), so an unguarded completion here
    // used to leak this POST's postInFlight-clear/setComposerBusy(false)
    // (and its success/error message) onto whichever session happened to
    // be open when the response finally landed, if the operator navigated
    // away — or to a different session — while it was still in flight. The
    // SAME guard protects the optimistic pendingSend's failure rollback
    // below: a POST for a session the operator has since left must never
    // reach into a DIFFERENT (possibly same-clientId-by-coincidence, though
    // that can't actually happen — see nextPendingSendId) session's
    // pendingSends array.
    var loadToken = detailState.loadToken;
    function stillCurrent() { return !!detailState && detailState.loadToken === loadToken; }

    // Optimistic: render the operator's own text into the transcript RIGHT
    // NOW, before the POST below has even been issued — see this section's
    // header comment. detailState.pendingSends is model input, not a DOM
    // hack: it survives every re-render (the 1s tick, a live delta) exactly
    // like durable/live data, via transcriptModel's own pure fold, until
    // reconciled (success path) or explicitly rolled back (failure path,
    // below).
    var clientId = nextPendingSendId();
    detailState.pendingSends.push({ text: text, clientId: clientId });
    renderDetail();

    // rollback undoes the optimistic pendingSend on a failed POST (it was
    // never real) and surfaces the failure text inline — the one thing the
    // two failure branches below (a non-2xx response, a network throw) both
    // need to do, factored out so that shared behavior can't drift apart.
    function rollback(errText) {
      err.textContent = errText;
      removePendingSend(detailState, clientId);
      renderDetail();
    }

    api("POST", "/session/" + encodeURIComponent(sid) + "/prompt_async", { parts: [{ type: "text", text: text }] })
      .then(function (resp) {
        return resp.json().catch(function () { return null; }).then(function (body) { return { resp: resp, body: body }; });
      })
      .then(function (r) {
        if (!stillCurrent()) return;
        if (r.resp.ok) {
          input.value = "";
          // No pendingSend removal here — leave it in place. The stream
          // event (a "message" or "prompt.queued" arrival) will reconcile
          // it out via transcriptModel's own dedup, same as it always has
          // for prompt.queued's own placeholder.
        } else {
          rollback((r.body && r.body.error) || ("send failed (status " + r.resp.status + ")"));
        }
      }, function (netErr) {
        if (!stillCurrent()) return;
        rollback("send failed: " + ((netErr && netErr.message) || "network error"));
      })
      .then(function () {
        if (stillCurrent()) {
          detailState.postInFlight = false;
          setComposerBusy(false);
        }
      });
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
}
wireComposer();

/* ---------- connect / disconnect lifecycle ---------- */

function setFormBusy(busy, label) {
  baseInput.disabled = busy;
  tokenInput.disabled = busy;
  connectBtn.disabled = busy;
  connectBtn.textContent = label;
}

// attemptConnect: GET /health (unauthenticated — identity + reachability)
// THEN authed GET /session, so a wrong token surfaces as a 401 from /session,
// never from /health (see the plan's Connect flow). On success this primes
// the SSE resume cursor from the poll (hub's approach — from=lastSeq, never
// from=0) before opening the stream.
function attemptConnect(base, token) {
  connectErr.textContent = "";
  return fetch(base + "/health").then(function (hResp) {
    if (!hResp.ok) throw { userMessage: "cannot reach " + base + " (health " + hResp.status + ")" };
    return hResp.json();
  }, function () {
    throw { userMessage: "cannot reach " + base };
  }).then(function (health) {
    return api2(base, token, "GET", "/session").then(function (sResp) {
      if (sResp.status === 401) throw { userMessage: "run token was rejected" };
      if (!sResp.ok) throw { userMessage: "session list failed (" + sResp.status + ")" };
      return sResp.json().then(function (list) { return { health: health, list: list }; });
    }, function () {
      throw { userMessage: "cannot reach " + base };
    });
  }).then(function (r) {
    state.base = base;
    state.token = token;
    state.health = r.health;
    state.sessions = new Map(r.list.map(function (s) { return [s.id, s]; }));
    state.activities = new Map();
    state.lastSeq = maxSeq(r.list);
    state.backoff = BACKOFF_MIN;
    localStorage.setItem(LS_BASE, base);
    localStorage.setItem(LS_TOKEN, token);
    document.body.classList.add("connected");
    renderIdentity();
    syncBoard(Date.now());
    // Preserve a "#s=<id>" deep link across the connect-time replaceState —
    // a bookmarked/shared session URL must still resolve to that session
    // once connected, not be silently dropped back to the bare board route.
    history.replaceState(null, "", route({ base: base, sessionId: unroute(location.hash).sessionId }));

    state.running = true;
    clearInterval(state.pollTimer);
    state.pollTimer = setInterval(pollOnce, POLL_MS);
    clearInterval(state.tickTimer);
    state.tickTimer = setInterval(tick, TICK_MS);
    setConnState("reconnecting"); // "connecting…" reuses the honest reconnecting label until the stream opens
    // applyRoute BEFORE connectStream: a "#s=<id>" deep link's history GET
    // (issued synchronously inside enterDetail) must claim its HTTP
    // connection before connectStream opens the long-lived, never-completing
    // SSE /event stream. On HTTP/1.1 (and behind some proxies) the streaming
    // response can otherwise pin a connection and queue the finite history
    // GET behind it for seconds — the intermittent "no messages yet on a
    // session that has history" seen live. Issuing the finite request first
    // lets it complete promptly; the stream then opens on its own connection.
    applyRoute(); // resolves a "#s=<id>" deep link into the detail view now that we're connected
    connectStream();
    return true;
  }, function (err) {
    connectErr.textContent = (err && err.userMessage) || "connect failed";
    return false;
  });
}

// api2 is attemptConnect's pre-state fetch helper: state.base/state.token
// aren't set until a connect attempt SUCCEEDS, so the /session probe during
// connect can't go through api() (which reads them from state).
function api2(base, token, method, path) {
  return fetch(base + path, { method: method, headers: { Authorization: "Bearer " + token } });
}

function forceDisconnect(reason) {
  state.running = false;
  if (state.abort) state.abort.abort();
  clearTimeout(state.streamTimer);
  clearInterval(state.pollTimer);
  clearInterval(state.tickTimer);
  document.body.classList.remove("connected");
  setConnState("disconnected");
  if (reason) connectErr.textContent = reason;
  // A disconnected instance can't serve a live detail view (history fetch
  // and the composer both need an authed connection) — drop back to the
  // board rather than leave a detail view showing frozen, increasingly
  // stale data. The URL fragment is left alone so a subsequent reconnect
  // (same token, corrected token, or the instance coming back) can resolve
  // straight back into it via applyRoute.
  if (detailState) exitDetail();
}

/* ---------- bootstrap ---------- */

(function bootstrap() {
  var storedBase = localStorage.getItem(LS_BASE) || "";
  var storedToken = localStorage.getItem(LS_TOKEN) || "";

  // #t=<token> capability URL (extractFragmentToken, TESTABLE): adopt into
  // the SAME localStorage key manual entry uses, then immediately scrub it
  // from the visible/bookmarkable URL via history.replaceState — a token
  // must never linger in browser history or a shared screenshot/link one
  // beat longer than it takes to read it. An explicit #t= wins over a
  // previously stored token: it is the fresher credential (e.g. shared via
  // a new link after a rotation) — see extractFragmentToken's own doc
  // comment for the tools/hub precedent this mirrors. This does NOT
  // weaken the auth model in any way: the token is still required, still
  // checked by attemptConnect exactly as a hand-typed one would be — this
  // only removes the typing, not the credential.
  var fragToken = extractFragmentToken(location.hash);
  if (fragToken.token) {
    storedToken = fragToken.token;
    localStorage.setItem(LS_TOKEN, storedToken);
    history.replaceState(null, "", fragToken.cleanedHash);
  }

  // embeddedConnectPlan (TESTABLE) is the single source of truth for the
  // whole "frictionless local" behavior — see its own doc comment for the
  // four composing outcomes. Read location.hash fresh (not the possibly-
  // stale value fragToken parsed above): if the token scrub just ran, this
  // is now the CLEANED hash, but "b" is preserved by cleanedHash's own
  // construction, so the fragment base decision is identical either way.
  var fragBase = unroute(location.hash).base;
  var plan = embeddedConnectPlan(location, fragToken.token, storedToken, fragBase);

  var baseLabel = document.getElementById("base-url-label");
  var introEl = document.getElementById("connect-intro");
  var noticeEl = document.getElementById("connect-cross-box-notice");
  baseLabel.hidden = !plan.showBaseField;
  if (plan.crossBoxNotice) {
    noticeEl.textContent = plan.crossBoxNotice;
    noticeEl.hidden = false;
  } else {
    noticeEl.hidden = true;
  }

  connectForm.addEventListener("submit", function (e) {
    e.preventDefault();
    // Fixed to this box's own origin once embedded (never user-edited —
    // the field is hidden): CSP (connect-src 'self') would block anything
    // else anyway, and a differing fragment base is exactly what
    // crossBoxNotice explains, not silently substitutes.
    var base = plan.embedded ? plan.base : baseInput.value.trim().replace(/\/+$/, "");
    var token = tokenInput.value;
    if (!base || !token) { connectErr.textContent = "base URL and token are required"; return; }
    setFormBusy(true, "Connecting…");
    attemptConnect(base, token).then(function () { setFormBusy(false, "Connect"); });
  });

  if (plan.embedded) {
    // auto-attempt-same-origin: no panel interaction required up front —
    // try immediately with whatever token is available (autoToken, or ""
    // when none — still worth trying: an Unauthenticated loopback box
    // accepts an empty Authorization header exactly like a correct
    // bearer token everywhere else). Success flips body.classList to
    // "connected", which the existing `body.connected #connect-panel {
    // display: none }` rule already hides entirely — "no connect panel,
    // no fields, nothing typed" falls out of THAT rule, not a new one.
    introEl.textContent = "Connecting to " + plan.base + "…";
    baseInput.value = plan.base;
    tokenInput.value = plan.autoToken || "";
    setConnState("disconnected");
    setFormBusy(true, "Connecting…");
    attemptConnect(plan.base, plan.autoToken || "").then(function (ok) {
      if (ok) return;
      // show-token-panel: the attempt failed (a real token is required
      // and none of autoToken's sources had a valid one, or this box
      // isn't reachable — either way attemptConnect already set
      // connectErr's text). Base stays fixed/shown as plain text via
      // introEl (showBaseField is already false — the field itself
      // stays hidden); clear whatever token was just tried so the
      // operator types a fresh one rather than staring at a rejected
      // value sitting in the field.
      introEl.textContent = "Connect to " + plan.base + " to see its sessions.";
      tokenInput.value = "";
      setFormBusy(false, "Connect");
    });
  } else {
    // show-full-panel: unchanged two-field flow.
    // Fragment #b= prefills the base URL field (e.g. a shared bookmark)
    // when nothing is stored yet; a stored preference still wins, since it
    // reflects a deliberate earlier choice this page must not override.
    baseInput.value = storedBase || fragBase || "";
    tokenInput.value = storedToken;
    setConnState("disconnected");
    if (storedBase && storedToken) {
      setFormBusy(true, "Connecting…");
      attemptConnect(storedBase, storedToken).then(function () { setFormBusy(false, "Connect"); });
    }
  }
})();
</script>
</body>
</html>
