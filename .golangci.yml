version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - revive
    - depguard
  settings:
    depguard:
      rules:
        internal-leaf:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/majorcontext/harness/cmd
              desc: internal packages never import cmd
        eventlog-leaf:
          files:
            - "**/internal/eventlog/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/internal/eventlog
            - github.com/majorcontext/harness/protocol
        turn-seam:
          files:
            - "**/internal/turn/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/internal/backoff
            - github.com/majorcontext/harness/internal/eventlog
            - github.com/majorcontext/harness/internal/modelref
            - github.com/majorcontext/harness/internal/tracing
            - github.com/majorcontext/harness/internal/turn
            - github.com/majorcontext/harness/protocol
            - go.opentelemetry.io/otel/attribute
            - go.opentelemetry.io/otel/trace
        backend-and-tool-below-session:
          files:
            - "**/internal/backend/**"
            - "**/internal/tool/**"
          deny:
            - pkg: github.com/majorcontext/harness/internal/session
              desc: backends and tools sit below the session actor
            - pkg: github.com/majorcontext/harness/internal/tree
              desc: backends and tools sit below the child tree
            - pkg: github.com/majorcontext/harness/internal/server
              desc: backends and tools sit below the HTTP mapping
        acp-seam:
          files:
            - "**/internal/acp/**"
            - "!**/internal/acp/acpauth/**"
            - "!**/internal/acp/cwdruntimes/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/config
            - github.com/majorcontext/harness/internal/acp
            - github.com/majorcontext/harness/internal/acp/rpc
            - github.com/majorcontext/harness/protocol
        acp-cwdruntimes:
          files:
            - "**/internal/acp/cwdruntimes/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/config
            - github.com/majorcontext/harness/internal/acp
            - github.com/majorcontext/harness/internal/acp/cwdruntimes
            - github.com/majorcontext/harness/internal/injectedauth
            - go.opentelemetry.io/otel/trace
        acp-acpauth:
          files:
            - "**/internal/acp/acpauth/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/config
            - github.com/majorcontext/harness/internal/acp
            - github.com/majorcontext/harness/internal/acp/acpauth
            - github.com/majorcontext/harness/internal/claudeauth
            - github.com/majorcontext/harness/internal/codexauth
            - github.com/majorcontext/harness/internal/injectedauth
            - github.com/majorcontext/harness/internal/process
        acp-rpc-leaf:
          files:
            - "**/internal/acp/rpc/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/internal/acp/rpc
        jshost-seam:
          files:
            - "**/internal/jshost/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/internal/jshost
            - github.com/majorcontext/harness/protocol
        selftool-seam:
          files:
            - "**/internal/selftool/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/internal/modelref
            - github.com/majorcontext/harness/internal/process
            - github.com/majorcontext/harness/internal/prompt
            - github.com/majorcontext/harness/internal/selftool
            - github.com/majorcontext/harness/internal/session
            - github.com/majorcontext/harness/internal/tool/proc
            - github.com/majorcontext/harness/internal/toolresult
            - github.com/majorcontext/harness/internal/turn
            - github.com/majorcontext/harness/protocol
        provider-wires:
          files:
            - $all
            - "!**/internal/backend/**"
            - "!**/provider/**"
            - "!**/e2e/**"
            - "!**/examples/**"
            - "!$test"
          deny:
            - pkg: github.com/majorcontext/harness/internal/provider/anthropic
              desc: only internal/backend builds a provider wire
            - pkg: github.com/majorcontext/harness/internal/provider/openai
              desc: only internal/backend builds a provider wire
            - pkg: github.com/majorcontext/harness/internal/provider/openaicompat
              desc: only internal/backend builds a provider wire
        message-consumers:
          files:
            - $all
            - "!**/internal/message/**"
            - "!**/internal/backend/**"
            - "!**/internal/provider/**"
            - "!**/internal/plugin/**"
            - "!**/internal/prompt/**"
            - "!**/internal/imageclamp/**"
            - "!**/internal/tool/pluginsrc/**"
            - "!$test"
          deny:
            - pkg: github.com/majorcontext/harness/internal/message
              desc: only backends, providers, plugins, the prompt, and the wire helpers imageclamp and pluginsrc use the provider-wire conversation model
        store-leaf:
          files:
            - "**/harness/store/**"
            - "**/store/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/internal/storecheck
            - github.com/majorcontext/harness/store
            - github.com/majorcontext/harness/storetest
        httpsync-leaf:
          files:
            - "**/httpsync/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/config
            - github.com/majorcontext/harness/httpsync
            - github.com/majorcontext/harness/protocol
            - github.com/majorcontext/harness/store
        httpapi-leaf:
          files:
            - "**/httpapi/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness
            - github.com/majorcontext/harness/httpapi
            - github.com/majorcontext/harness/internal/listing
            - github.com/majorcontext/harness/internal/server
            - github.com/majorcontext/harness/protocol
        plugin-leaf:
          files:
            - "**/plugin/*.go"
            - "!**/internal/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - github.com/majorcontext/harness/internal/plugin/wire
            - github.com/majorcontext/harness/plugin
            - github.com/majorcontext/harness/protocol
        config-leaf:
          files:
            - "**/config/**"
          list-mode: strict
          allow:
            - $gostd
    revive:
      rules:
        - name: exported
  exclusions:
    paths:
      - testdata

issues:
  new-from-merge-base: origin/main
