name: ACP TCK

# Runs the ACP Test Compatibility Kit against the `harness acp` binary with a
# scripted model. The job is advisory: it reports and never fails the workflow
# run. `go run ./internal/acptck` exits non-zero when a MANDATORY requirement
# fails outside testdata/acp-tck-allow.txt, so the step shows red.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"
  pull_request:
    paths:
      - "internal/acp/**"
      - "internal/acptck/**"
      - "cmd/harness/acp*"
      - "testdata/acp-tck-allow.txt"
      - ".github/workflows/acp-tck.yml"

jobs:
  tck:
    name: TCK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      # Exact commit of github.com/agentclientprotocol/acp-tck (Apache-2.0).
      # The TCK is third-party Python code: it runs here and nowhere else.
      TCK_COMMIT: fa00ccdc13dfaa4b288a91877c1f3e468af4aa7d
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"

      - name: Fetch the TCK
        run: |
          git init "$RUNNER_TEMP/acp-tck"
          git -C "$RUNNER_TEMP/acp-tck" fetch --depth 1 https://github.com/agentclientprotocol/acp-tck.git "$TCK_COMMIT"
          git -C "$RUNNER_TEMP/acp-tck" checkout --detach FETCH_HEAD
          uv --project "$RUNNER_TEMP/acp-tck" sync --frozen

      - name: Build harness
        run: go build -o "$RUNNER_TEMP/harness" ./cmd/harness

      - name: Run the TCK
        run: >
          go run ./internal/acptck
          -harness "$RUNNER_TEMP/harness"
          -tck "$RUNNER_TEMP/acp-tck"
          -report "$RUNNER_TEMP/acp-tck-report.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-tck-report
          path: ${{ runner.temp }}/acp-tck-report.json
          if-no-files-found: ignore
