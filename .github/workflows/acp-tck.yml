name: ACP TCK

# Runs the ACP Test Compatibility Kit against the `harness acp` binary with a
# scripted model. `go run ./internal/acptck` exits non-zero when a MANDATORY or
# CAPABILITY requirement fails outside testdata/acp-tck-allow.txt, and the job
# fails. The check is required to merge, so it runs on every pull request.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"
  pull_request: {}

permissions:
  contents: read

jobs:
  tck:
    name: TCK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Exact commit of github.com/agentclientprotocol/acp-tck (Apache-2.0).
      # The TCK is third-party Python code: it runs here and nowhere else.
      UV_PYTHON: "3.14.5"
      TCK_COMMIT: fa00ccdc13dfaa4b288a91877c1f3e468af4aa7d
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # v6.8.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.13"

      - name: Fetch the TCK
        run: |
          git init "$RUNNER_TEMP/acp-tck"
          git -C "$RUNNER_TEMP/acp-tck" fetch --depth 1 https://github.com/agentclientprotocol/acp-tck.git "$TCK_COMMIT"
          git -C "$RUNNER_TEMP/acp-tck" checkout --detach FETCH_HEAD
          uv --project "$RUNNER_TEMP/acp-tck" sync --frozen

      - name: Build harness
        run: go build -o "$RUNNER_TEMP/harness" ./cmd/harness

      - name: Run the TCK
        run: >
          go run ./internal/acptck
          -harness "$RUNNER_TEMP/harness"
          -tck "$RUNNER_TEMP/acp-tck"
          -report "$RUNNER_TEMP/acp-tck-report.json"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acp-tck-report
          path: ${{ runner.temp }}/acp-tck-report.json
          if-no-files-found: ignore
