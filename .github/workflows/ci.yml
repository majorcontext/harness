name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: {}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-static-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-static-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            for file in $unformatted; do
              gofmt -d "$file"
            done
            exit 1
          fi

      - name: Protocol drift
        run: |
          go generate ./protocol
          git diff --exit-code -- protocol/

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14
          only-new-issues: true

      - name: Startup budget
        # AGENTS.md: startup speed is a CI-enforced budget. Best-of-5 keeps
        # shared-runner noise out; the bound is generous versus the ~5ms
        # local target but still catches any accidental init-time work
        # (network, config scans, subprocess spawns).
        run: |
          go build -o harness ./cmd/harness/
          ./harness version > /dev/null  # warm page cache
          best=999999
          for i in 1 2 3 4 5; do
            start=$(date +%s%N)
            ./harness version > /dev/null
            elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
            [ "$elapsed" -lt "$best" ] && best=$elapsed
          done
          echo "best-of-5 startup: ${best}ms (budget: 50ms)"
          [ "$best" -le 50 ]
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1}}'
          printf '%s\n' "$init" | ./harness acp > /dev/null  # warm page cache
          best=999999
          for i in 1 2 3 4 5; do
            start=$(date +%s%N)
            out=$(printf '%s\n' "$init" | ./harness acp)
            elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
            [ "$elapsed" -lt "$best" ] && best=$elapsed
          done
          case "$out" in '{"jsonrpc":"2.0","id":1,"result":'*) ;; *) echo "acp: no initialize result: $out"; exit 1 ;; esac
          echo "best-of-5 time to initialize: ${best}ms (budget: 50ms)"
          [ "$best" -le 50 ]

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-static-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  gates:
    name: Gates
    runs-on: ubuntu-latest
    env:
      GATES_BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-gates-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-gates-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Gates
        env:
          GATES_REQUIRED: '1'
        run: |
          set -o pipefail
          go test -race -count=1 -json -run '^TestRepository$' ./internal/gates/ | go run ./internal/testtime -title Gates -job gates

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-gates-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Build and size budget
        # Builds cmd/harness-wasm for GOOS=js GOARCH=wasm and fails when the
        # module is larger than testdata/wasm-size-budget.txt. The steps that
        # run the module in a JavaScript host belong in this job.
        run: go run ./internal/wasmsize

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  unit:
    name: Unit
    runs-on: ubuntu-latest
    env:
      GATES_BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Unit tests
        # The e2e package runs in its own jobs.
        # testtime prints the test log, fails a test or a package over
        # testdata/test-time-budget.txt, and lists the slowest tests in the
        # step summary.
        run: |
          set -o pipefail
          go test -race -count=1 -json -skip '^TestRepository$' $(go list ./... | grep -v '/e2e$') | go run ./internal/testtime -title Unit -job unit

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-unit-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-contract-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-contract-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Contract
        # -count=1 keeps a cached e2e result from skipping the coverage table.
        # Only the e2e package reads HARNESS_E2E_COVER.
        env:
          HARNESS_E2E_COVER: '1'
        run: |
          set -o pipefail
          go test -race -count=1 -json ./e2e/ | go run ./internal/testtime -title Contract -job contract

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-contract-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  runtime:
    name: Runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-runtime-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-runtime-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - name: Runtime contract
        # Runs the contract rows on harness.Runtime in process by their
        # dispositions in e2e/runtime_rows_test.go. A test that has no runtime
        # subtest runs its whole body under -run, so -skip drops the tests of
        # the serve binary and the CLI, which the Contract job runs.
        run: |
          set -o pipefail
          HARNESS_E2E_RUNTIME=1 go test -race -count=1 -json ./e2e/ -run '^TestContract[A-Za-z]*$/^runtime$' -skip '^TestContract(CLI|Serve|TurnMetrics|StartupPrewarmLines|UnknownModel|Inventory|ListSkips)' | go run ./internal/testtime -title 'Runtime contract' -job runtime

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-runtime-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  node-wasm:
    name: Node wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-node-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-node-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: ACP scenarios on the wasm module
        # HARNESS_E2E_NODE=1 makes a missing node fail the test, not skip it.
        env:
          HARNESS_E2E_NODE: '1'
        run: go test -race -count=1 ./e2e/ -run '^(TestACPScenarios|TestNode.*)$' -skip '^TestACPScenarios/[^/]+/(binary|in-process)$'

      - name: sdk/embed over the Worker transport
        # The tests start the module in a worker_threads Worker; a missing
        # variable fails them, it does not skip them.
        run: |
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go build -o "$RUNNER_TEMP/harness.wasm" ./cmd/harness-wasm
          go build -o "$RUNNER_TEMP/embedfake" ./internal/embedfake
          HARNESS_EMBEDFAKE="$RUNNER_TEMP/embedfake" HARNESS_WASM="$RUNNER_TEMP/harness.wasm" HARNESS_WASM_EXEC="$(go env GOROOT)/lib/wasm/wasm_exec.js" node --test sdk/embed/test/*.test.mjs

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-node-wasm-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}

  browser:
    name: Browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-browser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-browser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            setup-go-${{ runner.os }}-

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/embed/package-lock.json

      - name: Install Playwright
        # The lock file pins Playwright.
        working-directory: sdk/embed
        run: npm ci --ignore-scripts

      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('sdk/embed/package-lock.json') }}

      - name: Install Chromium
        # A cache hit skips the download; --with-deps always installs the
        # system libraries.
        working-directory: sdk/embed
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser rows
        # HARNESS_E2E_BROWSER=1 makes a missing node, Playwright, or Chromium
        # fail the test, not skip it.
        env:
          HARNESS_E2E_BROWSER: '1'
        run: go test -race -count=1 ./e2e/ -run '^(TestBrowserRows|TestACPBrowserScenarios)$'

      - name: Save the Go caches
        # Only main saves, so every job restores the newest build of main.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/go/pkg/mod
            /home/runner/.cache/go-build
          key: go-browser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
