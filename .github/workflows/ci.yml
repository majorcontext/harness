name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: {}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    env:
      GATES_BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt required for:\n%s\n' "$unformatted"
            for file in $unformatted; do
              gofmt -d "$file"
            done
            exit 1
          fi

      - name: Protocol drift
        run: |
          go generate ./protocol
          git diff --exit-code -- protocol/

      - run: go vet ./...

      - name: Gates
        env:
          GATES_REQUIRED: '1'
        run: go test -race -count=1 -v -run '^TestRepository$' ./internal/gates/

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14
          only-new-issues: true

      - name: Startup budget
        # AGENTS.md: startup speed is a CI-enforced budget. Best-of-5 keeps
        # shared-runner noise out; the bound is generous versus the ~5ms
        # local target but still catches any accidental init-time work
        # (network, config scans, subprocess spawns).
        run: |
          go build -o harness ./cmd/harness/
          ./harness version > /dev/null  # warm page cache
          best=999999
          for i in 1 2 3 4 5; do
            start=$(date +%s%N)
            ./harness version > /dev/null
            elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
            [ "$elapsed" -lt "$best" ] && best=$elapsed
          done
          echo "best-of-5 startup: ${best}ms (budget: 50ms)"
          [ "$best" -le 50 ]

  unit:
    name: Unit
    runs-on: ubuntu-latest
    env:
      GATES_BASE_REF: origin/${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: true

      - name: Unit tests
        # The e2e package runs in its own jobs.
        run: go test -race -count=1 -skip '^TestRepository$' $(go list ./... | grep -v '/e2e$')

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: true

      - name: Contract
        # -count=1 keeps a cached e2e result from skipping the coverage table.
        # Only the e2e package reads HARNESS_E2E_COVER.
        env:
          HARNESS_E2E_COVER: '1'
        run: go test -race -count=1 ./e2e/

  runtime:
    name: Runtime contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Production dependencies must remain pure Go. Module caching covers
          # both production adapters and test-only support packages.
          cache: true

      - name: Runtime contract
        # Runs the contract rows on harness.Runtime in process by their
        # dispositions in e2e/runtime_rows_test.go. A test that has no runtime
        # subtest runs its whole body under -run, so -skip drops the tests of
        # the serve binary and the CLI, which the Contract job runs.
        run: HARNESS_E2E_RUNTIME=1 go test -race -count=1 ./e2e/ -run '^TestContract[A-Za-z]*$/^runtime$' -skip '^TestContract(CLI|Serve|TurnMetrics|StartupPrewarmLines|UnknownModel|Inventory|ListSkips)'
