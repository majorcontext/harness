name: Refresh model metadata

# Regenerates modelmeta's context-window tables from models.dev and opens or
# updates one pull request when the generated file changes. Pull requests that
# GITHUB_TOKEN opens do not start other workflows, so a maintainer must push
# an empty commit or close and reopen the pull request to run CI.
on:
  schedule:
    # 08:00 UTC, one hour before the fuzz workflow.
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: modelmeta-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: automation/modelmeta-refresh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate tables
        run: go generate ./modelmeta/

      - name: Test generated tables
        run: go test ./modelmeta/...

      - name: Open or update pull request
        run: |
          if git diff --quiet -- modelmeta/context_windows_gen.go; then
            echo "Generated file is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add modelmeta/context_windows_gen.go
          git commit -m "chore(modelmeta): refresh context windows from models.dev" \
            -m "Regenerated with go generate ./modelmeta/ from https://models.dev/api.json."
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore(modelmeta): refresh context windows from models.dev" \
              --body "Daily regeneration of \`modelmeta/context_windows_gen.go\` from https://models.dev/api.json. Review the diff for new or changed windows. Hand-written entries live in \`modelmeta/overrides.json\`."
          fi
